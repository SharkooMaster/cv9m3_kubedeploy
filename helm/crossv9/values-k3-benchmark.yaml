# CrossV9 tuned baseline for a 5-node k3 cluster.
# Replace image repositories and secret values before deploy.

imagePullSecrets: []

images:
  agent:
    repository: "ghcr.io/sharkoomaster/crossv9-agent"
    tag: "sha256:13ce950b27f576b37e648eb4f98e928526e12d2ab896773d9a535e95169fa7a4"
    pullPolicy: IfNotPresent
  gateway:
    repository: "ghcr.io/sharkoomaster/crossv9-gateway"
    tag: "sha256:6a7d54ad17604e156480196738c6a045abc5cc644a5e6b9cb136abb3d7afb6bf"
    pullPolicy: IfNotPresent
  cross:
    repository: "ghcr.io/sharkoomaster/crossv9-cross"
    tag: "sha256:8710ce9f44edb0bcc79d8784d32f03a8fbd7739f70b5b062cfd15d8cf7e7220a"
    pullPolicy: IfNotPresent
  webinterface:
    repository: "ghcr.io/sharkoomaster/crossv9-webinterface"
    tag: "latest"
    pullPolicy: IfNotPresent

chunkSize: 1024  # Bytes per chunk (used by agent, cross, gateway)

mode:
  crossMode: "local"

postgres:
  enabled: false

externalPostgres:
  # Matches running postgres pod env:
  # POSTGRES_DB=yourdbname
  # POSTGRES_USER=youruser
  # POSTGRES_PASSWORD=yourpassword
  host: "postgres.postgres.svc.cluster.local"
  port: 5432
  user: "youruser"
  password: "yourpassword"
  database: "yourdbname"

redis:
  enabled: true
  image: "redis:7-alpine"
  port: 6379
  servicePort: 6379
  maxMemory: "30gb"
  maxMemoryPolicy: "allkeys-lru"
  persistence:
    enabled: true
    storageClassName: "local-path"
    size: "200Gi"
  resources:
    requests:
      memory: "8Gi"
    limits:
      memory: "16Gi"

externalRedis:
  host: ""
  port: 6379

agent:
  workloadKind: DaemonSet
  storageBackend: rocksdb
  rocksdb:
    path: "/data/chunks/rocksdb"
  replicationFactor: 2  # Replicate to 2 other agents (3 total including self)
  s3:
    endpoint: "http://192.168.50.55:9000"
    bucket: "chunks"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    forcePathStyle: true
    useSsl: false
  bucketCache:
    maxGb: 0             # 0 = auto-detect: 55% of pod memory (respects cgroup/K8s limits per node)
    evictionIntervalSec: 10  # Kept for API compat, background evictor uses watermarks now
    highWaterPct: "0.70"     # Background eviction starts when usage > 70% of budget
    lowWaterPct: "0.50"      # Background eviction stops when usage drops to 50% (20% headroom for bursts)
    hardCeilingPct: "0.90"   # Emergency inline eviction at 90% — drains back to 50%
  chunkCache:
    sizeMb: 0            # 0 = auto-detect: 15% of pod memory (adapts to node RAM automatically)
    ttlMinutes: 5
  persistence:
    enabled: true
    hostPath: "/var/lib/crossv9/chunks"  # DaemonSet uses hostPath (each node gets its own dir)
    storageClassName: "local-path"  # only used when workloadKind != DaemonSet
    size: "200Gi"
  # Resource limits: the agent auto-sizes its caches based on the cgroup limit.
  # For heterogeneous nodes (16GB/32GB/64GB), you can either:
  #   1. Set limits to the smallest node size (safe, wastes RAM on big nodes)
  #   2. Remove limits entirely and let the agent auto-detect physical RAM (maximizes RAM usage)
  #   3. Use separate DaemonSets with node selectors for per-node sizing
  # Option 2 is recommended for DaemonSets where the agent is the primary workload:
  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"     # minimum guaranteed
    limits:
      cpu: "8000m"
      # No memory limit → agent reads physical RAM from cgroup and auto-sizes.
      # 16GB node → ~8.8GB bucket cache + ~2.4GB chunk cache + ~4.8GB headroom
      # 32GB node → ~17.6GB bucket cache + ~4.8GB chunk cache + ~9.6GB headroom
      # 64GB node → ~35.2GB bucket cache + ~9.6GB chunk cache + ~19.2GB headroom

gateway:
  replicaCount: 4
  # High-throughput settings for 152 CPU cores and 155GB RAM
  searchTimeoutSec: 30
  storeTimeoutSec: 45
  streamConcurrency: 200  # High concurrency for I/O-bound queries
  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"
    limits:
      cpu: "4000m"
      memory: "12Gi"

cross:
  replicaCount: 4
  windowedThresholdMB: 256    # Files > this use v4.0.0 windowed compression (0 = always monolithic)
  windowSizeMB: 16            # Window size for v4.0.0 windowed compression
  maxUploadBytes: "107374182400"  # 100 GiB max upload (windowed handles RAM)
  maxConcurrent: 4            # Max concurrent compress/decompress per Cross pod (prevents OOM)
  pipelineParallelism: 4      # Number of parallel pipeline workers for windowed compression
  service:
    type: LoadBalancer
    grpcPort: 5000
    httpPort: 5001
    loadBalancerIP: ""
    externalTrafficPolicy: Cluster
    annotations: {}
  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"

webinterface:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  service:
    type: LoadBalancer
    port: 80
  ingress:
    enabled: false

observability:
  enabled: true
  otel:
    endpoint: "http://crossv9-crossv9-otel-collector:4317"
  prometheus:
    image: "prom/prometheus:v2.54.1"
    retention: "7d"
    service:
      type: ClusterIP
      port: 9090
  grafana:
    image: "grafana/grafana:11.1.4"
    adminUser: "admin"
    adminPassword: "admin"
    service:
      type: LoadBalancer
      port: 3000
  tempo:
    image: "grafana/tempo:2.6.1"
  pyroscope:
    image: "grafana/pyroscope:1.12.0"
    service:
      type: ClusterIP
      port: 4040
  alloy:
    image: "grafana/alloy:v1.4.2"
