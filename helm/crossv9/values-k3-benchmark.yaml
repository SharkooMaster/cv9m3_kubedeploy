# CrossV9 tuned baseline for a 5-node k3 cluster.
# Replace image repositories and secret values before deploy.

imagePullSecrets: []

images:
  agent:
    repository: "ghcr.io/sharkoomaster/crossv9-agent"
    tag: "sha256:764ec8bc7ad2c59b2eb81843530d394bac9f4b88fab31a07ad1f4f7113f7bc03"
    pullPolicy: IfNotPresent
  gateway:
    repository: "ghcr.io/sharkoomaster/crossv9-gateway"
    tag: "sha256:6fae1ab282a83b474a089043c0d31e99d3e42458ea0485c4adf7a23dd06bf5e4"
    pullPolicy: IfNotPresent
  cross:
    repository: "ghcr.io/sharkoomaster/crossv9-cross"
    tag: "sha256:50d3fd5811f03b2fb651a80618188cc7539c3063d83e5047f8cbbd156e387cce"
    pullPolicy: IfNotPresent
  webinterface:
    repository: "ghcr.io/sharkoomaster/crossv9-webinterface"
    tag: "latest"
    pullPolicy: IfNotPresent

mode:
  crossMode: "local"

postgres:
  enabled: false

externalPostgres:
  # Matches running postgres pod env:
  # POSTGRES_DB=yourdbname
  # POSTGRES_USER=youruser
  # POSTGRES_PASSWORD=yourpassword
  host: "postgres.postgres.svc.cluster.local"
  port: 5432
  user: "youruser"
  password: "yourpassword"
  database: "yourdbname"

redis:
  enabled: true
  image: "redis:7-alpine"
  port: 6379
  servicePort: 6379
  maxMemory: "30gb"
  maxMemoryPolicy: "allkeys-lru"
  persistence:
    enabled: true
    storageClassName: "local-path"
    size: "200Gi"
  resources:
    requests:
      memory: "8Gi"
    limits:
      memory: "16Gi"

externalRedis:
  host: ""
  port: 6379

agent:
  workloadKind: DaemonSet
  storageBackend: rocksdb
  rocksdb:
    path: "/data/chunks/rocksdb"
  replicationFactor: 2  # Replicate to 2 other agents (3 total including self)
  s3:
    endpoint: "http://192.168.50.55:9000"
    bucket: "chunks"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    forcePathStyle: true
    useSsl: false
  chunkCache:
    sizeMb: 8192
    ttlMinutes: 60
  persistence:
    enabled: true
    hostPath: "/var/lib/crossv9/chunks"  # DaemonSet uses hostPath (each node gets its own dir)
    storageClassName: "local-path"  # only used when workloadKind != DaemonSet
    size: "200Gi"
  resources:
    requests:
      memory: "8Gi"  # Increased memory for caching and processing
    limits:
      memory: "24Gi"  # More memory for chunk cache and RocksDB

gateway:
  replicaCount: 4
  # High-throughput settings for 152 CPU cores and 155GB RAM
  searchTimeoutSec: 30
  storeTimeoutSec: 45
  streamConcurrency: 200  # High concurrency for I/O-bound queries
  resources:
    requests:
      memory: "4Gi"  # Increased memory
    limits:
      memory: "16Gi"  # More memory for high-throughput

cross:
  replicaCount: 4
  service:
    type: LoadBalancer
    grpcPort: 5000
    httpPort: 5001
    loadBalancerIP: ""
    externalTrafficPolicy: Cluster
    annotations: {}
  resources:
    requests:
      memory: "4Gi"  # Increased memory
    limits:
      memory: "16Gi"  # More memory for parallel processing

webinterface:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  service:
    type: LoadBalancer
    port: 80
  ingress:
    enabled: false

observability:
  enabled: true
  otel:
    endpoint: "http://crossv9-crossv9-otel-collector:4317"
  prometheus:
    image: "prom/prometheus:v2.54.1"
    retention: "7d"
    service:
      type: ClusterIP
      port: 9090
  grafana:
    image: "grafana/grafana:11.1.4"
    adminUser: "admin"
    adminPassword: "admin"
    service:
      type: LoadBalancer
      port: 3000
  tempo:
    image: "grafana/tempo:2.6.1"
  pyroscope:
    image: "grafana/pyroscope:1.12.0"
    service:
      type: ClusterIP
      port: 4040
  alloy:
    image: "grafana/alloy:v1.4.2"
