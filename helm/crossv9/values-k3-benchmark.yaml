# CrossV9 tuned baseline for a 5-node k3 cluster.
# Replace image repositories and secret values before deploy.

imagePullSecrets: []

images:
  agent:
    repository: "ghcr.io/sharkoomaster/crossv9-agent"
    tag: "sha256:cf391d9228c8760001c5b5b93427988ba868ae315266db2f11fe0e2fb60b94c3"
    pullPolicy: IfNotPresent
  gateway:
    repository: "ghcr.io/sharkoomaster/crossv9-gateway"
    tag: "sha256:6a7d54ad17604e156480196738c6a045abc5cc644a5e6b9cb136abb3d7afb6bf"
    pullPolicy: IfNotPresent
  cross:
    repository: "ghcr.io/sharkoomaster/crossv9-cross"
    tag: "sha256:d6dca9cfb2e5b73175b0e39e19993b4a851129a5aa7a93b15836774af2d551e9"
    pullPolicy: IfNotPresent
  webinterface:
    repository: "ghcr.io/sharkoomaster/crossv9-webinterface"
    tag: "latest"
    pullPolicy: IfNotPresent
  benchrunner:
    repository: "ghcr.io/sharkoomaster/crossv9-benchrunner"
    tag: "sha256:3b2b9491eae9d88d80b69beec6039e53101c473172967062595a3387384d7caa"
    pullPolicy: IfNotPresent

chunkSize: 1024  # Bytes per chunk (used by agent, cross, gateway)

mode:
  crossMode: "local"

postgres:
  enabled: false

externalPostgres:
  # Matches running postgres pod env:
  # POSTGRES_DB=yourdbname
  # POSTGRES_USER=youruser
  # POSTGRES_PASSWORD=yourpassword
  host: "postgres.postgres.svc.cluster.local"
  port: 5432
  user: "youruser"
  password: "yourpassword"
  database: "yourdbname"

redis:
  enabled: false
  image: "redis:7-alpine"
  port: 6379
  servicePort: 6379
  maxMemory: "30gb"
  maxMemoryPolicy: "allkeys-lru"
  persistence:
    enabled: true
    storageClassName: "local-path"
    size: "200Gi"
  resources:
    requests:
      memory: "8Gi"
    limits:
      memory: "16Gi"

externalRedis:
  host: ""
  port: 6379

agent:
  workloadKind: DaemonSet
  storageBackend: rocksdb
  rocksdb:
    path: "/data/chunks/rocksdb"
  replicationFactor: 2  # Replicate to 2 other agents (3 total including self)
  s3:
    endpoint: "http://192.168.50.55:9000"
    bucket: "chunks"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    forcePathStyle: true
    useSsl: false
  bucketCache:
    maxGb: 0             # 0 = auto-detect: 10% of node memory (cold searches use RocksDB block cache at 25%)
    evictionIntervalSec: 10  # Kept for API compat, background evictor uses watermarks now
    highWaterPct: "0.70"     # Background eviction starts when usage > 70% of budget
    lowWaterPct: "0.50"      # Background eviction stops when usage drops to 50% (20% headroom for bursts)
    hardCeilingPct: "0.90"   # Emergency inline eviction at 90% — drains back to 50%
  chunkCache:
    sizeMb: 0            # 0 = auto-detect: 5% of node memory (system guard keeps 10% free via /proc/meminfo)
    ttlMinutes: 5
  laneIndex:
    enabled: "false"           # Lane hash index for L2 global sub-chunk search
    hashBits: "16"            # Mini-LSH bitstring width
    searchMax: "50"           # Max results per lane query
  persistence:
    enabled: true
    hostPath: "/var/lib/crossv9/chunks"  # DaemonSet uses hostPath (each node gets its own dir)
    storageClassName: "local-path"  # only used when workloadKind != DaemonSet
    size: "300Gi"
  # Resource limits: the agent auto-sizes caches (25% bucket + 5% chunk = 30% of node RAM).
  # A system memory guard reads /proc/meminfo every 2 seconds and ensures 10% of node RAM
  # stays free AT ALL TIMES. If free drops below 10%, it nukes chunk cache and evicts
  # bucket cache aggressively until free >= 15%.
  #
  # Expected memory at steady state:
  #   32GB node → ~5.6GB bucket + ~1.1GB chunk + ~5GB overhead ≈ 12GB total, 20GB free
  #   64GB node → ~11.2GB bucket + ~2.2GB chunk + ~5GB overhead ≈ 19GB total, 45GB free
  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"     # minimum guaranteed
    limits:
      cpu: "8000m"
      # No memory limit → agent reads physical RAM and auto-sizes.
      # Process-level safety valve evicts aggressively if process exceeds 60% of node RAM.

gateway:
  replicaCount: 4
  # High-throughput settings for 152 CPU cores and 155GB RAM
  searchTimeoutSec: 30
  storeTimeoutSec: 45
  streamConcurrency: 200  # High concurrency for I/O-bound queries
  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"
    limits:
      cpu: "4000m"
      memory: "12Gi"

cross:
  replicaCount: 4
  windowedThresholdMB: 256    # Files > this use v4.0.0 windowed compression (0 = always monolithic)
  windowSizeMB: 16            # Window size for v4.0.0 windowed compression
  maxUploadBytes: "107374182400"  # 100 GiB max upload (windowed handles RAM)
  maxConcurrent: 4            # Max concurrent compress/decompress per Cross pod (prevents OOM)
  pipelineParallelism: 4      # Number of parallel pipeline workers for windowed compression
  mosaicDedup:
    enabled: "false"          # Level 2 Mosaic Dedup (set "true" to enable)
    entropyThreshold: "4.0"   # Shannon entropy threshold (bits/byte) for L2 trigger
    topK: "10"                # Top-K candidates from agents for mosaic assembly
  laneSearch:
    enabled: "false"          # Global lane search for L2 mosaic (requires agent laneIndex)
    hashBits: "16"            # Must match agent laneIndex.hashBits
    searchMax: "50"           # Max results per lane query
  service:
    type: LoadBalancer
    grpcPort: 5000
    httpPort: 5001
    loadBalancerIP: ""
    externalTrafficPolicy: Cluster
    annotations: {}
  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"

webinterface:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  service:
    type: LoadBalancer
    port: 80
  ingress:
    enabled: false

observability:
  enabled: true
  otel:
    endpoint: "http://crossv9-crossv9-otel-collector:4317"
  prometheus:
    image: "prom/prometheus:v2.54.1"
    retention: "7d"
    service:
      type: ClusterIP
      port: 9090
  grafana:
    image: "grafana/grafana:11.1.4"
    adminUser: "admin"
    adminPassword: "admin"
    service:
      type: LoadBalancer
      port: 3000
  tempo:
    image: "grafana/tempo:2.6.1"
  pyroscope:
    image: "grafana/pyroscope:1.12.0"
    service:
      type: ClusterIP
      port: 4040
  alloy:
    image: "grafana/alloy:v1.4.2"

benchrunner:
  enabled: true
  replicaCount: 1
  maxFileSizeGB: 4
  service:
    type: LoadBalancer
    port: 5050
    loadBalancerIP: ""
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"
