# CrossV9 tuned for 6-node k3 cluster: 5×32GB + 1×64GB (224GB total).
# Sized for stability during TB-scale benchmarks — no OOM crashes.
# Replace image repositories and secret values before deploy.

imagePullSecrets: []

images:
  agent:
    repository: "ghcr.io/sharkoomaster/crossv9-agent"
    tag: "sha256:e754da490ca7d96e0bd021e5e5c2fd67ec6254a85c73125faa141afb5a8bf42a"
    pullPolicy: Always
  gateway:
    repository: "ghcr.io/sharkoomaster/crossv9-gateway"
    tag: "sha256:6a7d54ad17604e156480196738c6a045abc5cc644a5e6b9cb136abb3d7afb6bf"
    pullPolicy: IfNotPresent
  cross:
    repository: "ghcr.io/sharkoomaster/crossv9-cross"
    tag: "sha256:e81de92a74b60c2ef7f26139a5f1bb17a44d51c813f56e5205bef607c46deaff"
    pullPolicy: Always
  webinterface:
    repository: "ghcr.io/sharkoomaster/crossv9-webinterface"
    tag: "latest"
    pullPolicy: IfNotPresent
  benchrunner:
    repository: "ghcr.io/sharkoomaster/crossv9-benchrunner"
    tag: "sha256:3cceb01db546d68172f4c037c2a4b4f05bb05ec980a5a1a1db77a0040fb3ce2e"
    pullPolicy: Always

chunkSize: 1024  # Bytes per chunk (used by agent, cross, gateway)

mode:
  crossMode: "local"

postgres:
  enabled: false

externalPostgres:
  # Matches running postgres pod env:
  # POSTGRES_DB=yourdbname
  # POSTGRES_USER=youruser
  # POSTGRES_PASSWORD=yourpassword
  host: "postgres.postgres.svc.cluster.local"
  port: 5432
  user: "youruser"
  password: "yourpassword"
  database: "yourdbname"

redis:
  enabled: false
  image: "redis:7-alpine"
  port: 6379
  servicePort: 6379
  maxMemory: "30gb"
  maxMemoryPolicy: "allkeys-lru"
  persistence:
    enabled: true
    storageClassName: "local-path"
    size: "200Gi"
  resources:
    requests:
      memory: "8Gi"
    limits:
      memory: "16Gi"

externalRedis:
  host: ""
  port: 6379

agent:
  workloadKind: DaemonSet
  storageBackend: rocksdb
  rocksdb:
    path: "/data/chunks/rocksdb"
  replicationFactor: 2  # Replicate to 2 other agents (3 total including self)
  s3:
    endpoint: "http://192.168.50.55:9000"
    bucket: "chunks"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    forcePathStyle: true
    useSsl: false
  bucketCache:
    maxGb: 0             # 0 = auto-detect: 10% of node memory (cold searches use RocksDB block cache at 25%)
    evictionIntervalSec: 10  # Kept for API compat, background evictor uses watermarks now
    highWaterPct: "0.70"     # Background eviction starts when usage > 70% of budget
    lowWaterPct: "0.50"      # Background eviction stops when usage drops to 50% (20% headroom for bursts)
    hardCeilingPct: "0.90"   # Emergency inline eviction at 90% — drains back to 50%
  chunkCache:
    sizeMb: 0            # 0 = auto-detect: 5% of node memory (system guard keeps 10% free via /proc/meminfo)
    ttlMinutes: 5
  laneIndex:
    enabled: "false"           # Lane hash index for L2 global sub-chunk search
    hashBits: "16"            # Mini-LSH bitstring width
    searchMax: "50"           # Max results per lane query
  persistence:
    enabled: true
    hostPath: "/var/lib/crossv9/chunks"  # DaemonSet uses hostPath (each node gets its own dir)
    storageClassName: "longhorn"  # only used when workloadKind != DaemonSet
    size: "300Gi"
  # Resource limits: the agent auto-sizes caches based on cgroup memory limit.
  # With a 14Gi limit, GC.GetGCMemoryInfo().TotalAvailableMemoryBytes sees 14GB,
  # so caches auto-size to that — NOT the full node RAM.
  #
  # Expected memory with 14Gi limit (after struct-key optimization):
  #   RocksDB native block caches: 25% of 14GB = 3.5GB (bucket + chunk)
  #   RocksDB memtables: ~512MB (native)
  #   Bucket metadata (managed): ~2-3GB (10M+ entries, value-type keys)
  #   Chunk cache (managed): 5% = 700MB
  #   .NET runtime overhead: ~500MB
  #   Total: ~7.2GB + headroom → well within 14Gi. Leaves 18GB free on 32GB nodes.
  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"
    limits:
      memory: "14Gi"

gateway:
  replicaCount: 2
  searchTimeoutSec: 30
  storeTimeoutSec: 45
  streamConcurrency: 100
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "4000m"

cross:
  replicaCount: 2
  windowedThresholdMB: 16     # Match client's windowed threshold
  windowSizeMB: 4             # Match client's 4MB block size
  maxUploadBytes: "107374182400"  # 100 GiB max upload (windowed handles RAM)
  maxConcurrent: 2            # 4 global blocks ÷ 2 pods = 2 per pod
  pipelineParallelism: 2      # Match reduced concurrency
  searchTopK: 10                  # Top-K candidates from L1 search (multi-reference diagnostics)
  mosaicDedup:
    enabled: "false"          # Level 2 Mosaic Dedup (set "true" to enable)
    entropyThreshold: "4.0"   # Shannon entropy threshold (bits/byte) for L2 trigger
    topK: "10"                # Top-K candidates from agents for mosaic assembly
  laneSearch:
    enabled: "false"          # Global lane search for L2 mosaic (requires agent laneIndex)
    hashBits: "16"            # Must match agent laneIndex.hashBits
    searchMax: "50"           # Max results per lane query
  ccfStore:
    enabled: "true"           # Cluster-stored CCF mode (enables dictionary + pack optimizer)
    path: "/data/ccf-store"   # Mount path for CCF storage PVC
    backgroundServicesDisabled: "true"  # Cross pods serve requests only (optimizer runs in dedicated pod)
    packThreshold: "100"      # Pack CCFs when this many unpacked CCFs accumulate
    packIntervalSec: "30"     # Optimizer check interval (30s for fast dict training during benchmarks)
    globalCompaction:
      enabled: "true"               # Repack unpacked + selected source packs each cycle (budgeted)
      maxSourcePacksPerCycle: "4"   # More packs per cycle for faster convergence
      maxReadBytesPerCycle: "1073741824"  # 1 GiB read budget per cycle
      maxDurationSec: "90"          # Longer cycles for more throughput
      maxWorkingSetMb: "0"          # Auto-detect: 85% of container memory (48Gi limit → ~40GB ceiling)
      optimizerParallelism: "0"     # 0 = auto (half of CPU cores, max 8)
    persistence:
      enabled: true
      storageClassName: "longhorn"
      size: "100Gi"
  service:
    type: LoadBalancer
    grpcPort: 5000
    httpPort: 5001
    loadBalancerIP: ""
    externalTrafficPolicy: Cluster
    annotations: {}
  resources:
    requests:
      cpu: "2000m"
      memory: "2Gi"
    limits:
      cpu: "8000m"

ccfOptimizer:
  enabled: true
  replicaCount: 1
  nodeSelector:
    kubernetes.io/hostname: "techpology2"
  resources:
    requests:
      cpu: "4000m"
      memory: "16Gi"
    limits:
      cpu: "16000m"
      memory: "48Gi"

webinterface:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  service:
    type: LoadBalancer
    port: 80
  ingress:
    enabled: false

observability:
  enabled: true
  otel:
    endpoint: "http://crossv9-crossv9-otel-collector:4317"
  prometheus:
    image: "prom/prometheus:v2.54.1"
    retention: "7d"
    service:
      type: ClusterIP
      port: 9090
  grafana:
    image: "grafana/grafana:11.1.4"
    adminUser: "admin"
    adminPassword: "admin"
    service:
      type: LoadBalancer
      port: 3000
  tempo:
    image: "grafana/tempo:2.6.1"
  pyroscope:
    image: "grafana/pyroscope:1.12.0"
    service:
      type: ClusterIP
      port: 4040
  alloy:
    image: "grafana/alloy:v1.4.2"

benchrunner:
  enabled: true
  replicaCount: 1
  maxFileSizeGB: 4
  service:
    type: LoadBalancer
    port: 5050
    loadBalancerIP: ""
  resources:
    requests:
      cpu: "1000m"
      memory: "1Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"
