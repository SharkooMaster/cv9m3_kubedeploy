# CrossV9 tuned for 6-node k3 cluster: 5×32GB + 1×64GB (224GB total).
# Sized for stability during TB-scale benchmarks — no OOM crashes.
# Replace image repositories and secret values before deploy.

# ── Longhorn (subchart) ──────────────────────────────────────────────────
# We own storage in this cluster, so our chart installs and configures
# Longhorn directly. Storage pool = every node (no disk labels required),
# replica count = 3, UI exposed as NodePort. Disable this only if you've
# pre-installed Longhorn through another channel.
longhorn:
  enabled: true
  namespaceOverride: "longhorn-system"
  defaultSettings:
    createDefaultDiskLabeledNodes: false
    defaultDataPath: "/var/lib/longhorn/"
    defaultReplicaCount: 3
    replicaAutoBalance: "best-effort"
    # Optional: bump this if your nodes have <15% free space and Longhorn
    # starts refusing to provision. Default 25 is fine for 6×i9 boxes.
    # storageMinimalAvailablePercentage: 10
  persistence:
    defaultClass: true
    defaultClassReplicaCount: 3
    reclaimPolicy: Delete
  service:
    ui:
      type: NodePort

imagePullSecrets: []

images:
  agent:
    repository: "ghcr.io/sharkoomaster/crossv9-agent"
    tag: "sha256:daad0abce8a36ebd1532a93c0caaac78eff6210505887c1c39e9b2fa1ad56140"
    pullPolicy: Always
  gateway:
    repository: "ghcr.io/sharkoomaster/crossv9-gateway"
    tag: "sha256:e32b7b974023c14112bf8cb73173c10459a1b7a8507ab18c37ddf027b476af33"
    pullPolicy: IfNotPresent
  cross:
    repository: "ghcr.io/sharkoomaster/crossv9-cross"
    tag: "sha256:74cadcd2430b823afb807a942129439ca084638d5769515402ca51c90e3cea9b"
    pullPolicy: Always
  webinterface:
    repository: "ghcr.io/sharkoomaster/crossv9-webinterface"
    tag: "latest"
    pullPolicy: IfNotPresent
  controlcenter:
    repository: "ghcr.io/sharkoomaster/crossv9-controlcenter"
    tag: "sha256:61433f9150e06b6cb15b5e128207caa1f9b084df9e7788a4c22df4be9c8e73b3"
    pullPolicy: Always
  benchrunner:
    repository: "ghcr.io/sharkoomaster/crossv9-benchrunner"
    tag: "sha256:3cceb01db546d68172f4c037c2a4b4f05bb05ec980a5a1a1db77a0040fb3ce2e"
    pullPolicy: Always

chunkSize: 1024  # Bytes per chunk (used by agent, cross, gateway)

mode:
  crossMode: "local"

postgres:
  enabled: false

externalPostgres:
  # Matches running postgres pod env:
  # POSTGRES_DB=yourdbname
  # POSTGRES_USER=youruser
  # POSTGRES_PASSWORD=yourpassword
  host: "postgres.postgres.svc.cluster.local"
  port: 5432
  user: "youruser"
  password: "yourpassword"
  database: "yourdbname"

redis:
  enabled: false
  image: "redis:7-alpine"
  port: 6379
  servicePort: 6379
  maxMemory: "30gb"
  maxMemoryPolicy: "allkeys-lru"
  persistence:
    enabled: true
    storageClassName: "local-path"
    size: "200Gi"
  resources:
    requests:
      memory: "8Gi"
    limits:
      memory: "16Gi"

externalRedis:
  host: ""
  port: 6379

# ── etcd: authoritative agent-membership registry ────────────────────────
# Single-pod etcd that holds /agents/<podName> → IP entries with 10s leases.
# Every agent registers on startup + heartbeats. Every cross pod watches the
# /agents/ prefix and updates its RendezvousRouter atomically.
#
# This is the fix for cross-pod routing divergence (cross pods disagreeing
# on which agent owns a bucket → wrong chunk bytes → INTEGRITY_DECOMPRESS).
# Membership data is ~2 KB total, so a single pod with a tiny Longhorn PVC
# is plenty.
etcd:
  enabled: true
  image: "quay.io/coreos/etcd:v3.5.13"
  persistence:
    enabled: true
    storageClassName: "longhorn"
    size: "1Gi"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

externalEtcd:
  endpoint: ""

agent:
  # StatefulSet gives each agent a stable identity (crossv9-agent-0, -1, ...)
  # and a per-pod Longhorn RWO volume that follows the pod across node
  # reschedules. This is required for correctness — Rendezvous Hashing now
  # routes by pod name (MY_POD_NAME), so chunks stored by agent-0 always
  # resolve back to agent-0's volume regardless of which node hosts it.
  #
  # Previous DaemonSet+hostPath setup was the root cause of decompress
  # corruption: hostPath data is tied to the node, but Rendezvous routing
  # could land at a different agent after any node blip, returning the new
  # agent's unrelated bytes at the same (BucketId, BucketKey) coordinates.
  workloadKind: StatefulSet
  # Pick this to match (or exceed) your previous DaemonSet pod count so
  # the hash ring stays roughly the same size. With 6 worker nodes the
  # previous DaemonSet ran 6 pods; mirror that here.
  replicaCount: 6
  storageBackend: rocksdb
  rocksdb:
    path: "/data/chunks/rocksdb"
  replicationFactor: 2  # Replicate to 2 other agents (3 total including self)
  s3:
    endpoint: "http://192.168.50.55:9000"
    bucket: "chunks"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    forcePathStyle: true
    useSsl: false
  bucketCache:
    maxGb: 0             # 0 = auto-detect: 10% of node memory (cold searches use RocksDB block cache at 25%)
    evictionIntervalSec: 10  # Kept for API compat, background evictor uses watermarks now
    highWaterPct: "0.70"     # Background eviction starts when usage > 70% of budget
    lowWaterPct: "0.50"      # Background eviction stops when usage drops to 50% (20% headroom for bursts)
    hardCeilingPct: "0.90"   # Emergency inline eviction at 90% — drains back to 50%
  chunkCache:
    sizeMb: 0            # 0 = auto-detect: 5% of node memory (system guard keeps 10% free via /proc/meminfo)
    ttlMinutes: 5
  laneIndex:
    enabled: "false"           # Lane hash index for L2 global sub-chunk search
    hashBits: "16"            # Mini-LSH bitstring width
    searchMax: "50"           # Max results per lane query
  persistence:
    enabled: true
    # StatefulSet branch: each pod gets its own Longhorn RWO PVC via
    # volumeClaimTemplates. The pod-pinned volume is what makes data
    # survive a node reschedule.
    storageClassName: "longhorn"
    size: "300Gi"
    # hostPath is dead in StatefulSet mode — left here only for the legacy
    # DaemonSet fallback path. Don't rely on it.
    hostPath: "/var/lib/crossv9/chunks"
  # Resource limits: the agent auto-sizes caches based on cgroup memory limit.
  # With a 14Gi limit, GC.GetGCMemoryInfo().TotalAvailableMemoryBytes sees 14GB,
  # so caches auto-size to that — NOT the full node RAM.
  #
  # Expected memory with 14Gi limit (post bounded-counter-cache):
  #   RocksDB native block caches: 25% of 14GB = 3.5GB (bucket + chunk)
  #   RocksDB memtables: ~512MB (native)
  #   Bucket counter cache (managed, BOUNDED): ~200MB regardless of corpus size
  #   Bucket cache L1 (managed, disabled by default): 0
  #   Chunk cache (managed): 5% = 700MB
  #   .NET runtime overhead: ~500MB
  #   Total: ~5.5GB steady state. Spare headroom for ingest bursts.
  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"
    limits:
      memory: "14Gi"
  # GC + counter-cache tuning. Defaults match what RocksDbBucketStorage and the agent
  # template assume; expose them for ad-hoc tuning during benchmarks without rebuilds.
  gc:
    conserveMemory: "5"          # Was 9 (aggressive) — caused liveness-probe stalls
    heapHardLimit: "0x100000000" # 4 GiB managed heap cap. Cgroup is 14 Gi; the
                                 # remaining 10 Gi is for RocksDB block cache,
                                 # bloom filters, memtables and glibc arenas.
    retainVm: "1"                # Keep retired segments — pairs with the 1-min
                                 # Forced LOH timer to cap frag at ~20 %.
    lohThreshold: "262144"       # 256 KB. Several per-batch arrays sit in the
                                 # 85 KB–256 KB band; raising the threshold
                                 # routes them through Gen0/1 where they compact.
  malloc:
    arenaMax: "2"                # Single biggest RSS-stability win on agent:
                                 # caps glibc arenas (default ≈8 × cores) so
                                 # RocksDB's native heap can't sprawl uncapped.
  counterCache:
    capacity: "1000000"          # ~150–200 MB managed; bounded regardless of total buckets
    shards: "64"                 # 64 shards × ~16k entries each → low contention
  livenessProbe:
    initialDelaySeconds: 60      # Allow constructor + first compaction to complete
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6          # Restart only after ~3 minutes of unresponsiveness

gateway:
  replicaCount: 2
  searchTimeoutSec: 30
  storeTimeoutSec: 45
  streamConcurrency: 100
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "4000m"

cross:
  replicaCount: 2
  windowedThresholdMB: 16     # Match client's windowed threshold
  windowSizeMB: 4             # Match client's 4MB block size
  # ── Integrity smoketest ──
  # Compress → immediate in-process decompress → byte-diff against original.
  # When mismatched, logs the EXACT chunk index, encode case, and the
  # discrepancy between what the encoder thought the base bytes were and
  # what the agent serves for that ref right now. Doubles compress latency.
  integrityDecompressSmoketest: true
  maxUploadBytes: "107374182400"  # 100 GiB max upload (windowed handles RAM)
  maxConcurrent: 2            # 4 global blocks ÷ 2 pods = 2 per pod
  pipelineParallelism: 2      # Match reduced concurrency
  searchTopK: 10                  # Top-K candidates from L1 search (multi-reference diagnostics)
  gc:
    conserveMemory: "5"           # Was 9 — too aggressive, caused GC thrash on 64 MB blocks
    heapHardLimit: "0x140000000"  # 5 GB managed heap cap; cross.resources.limits.memory = 8 Gi
    retainVm: "1"                 # Keep retired Gen2 segments so the next file
                                  # compress doesn't re-VirtualAlloc them.
    lohThreshold: "262144"        # 256 KB — most per-block arrays in the
                                  # compression pipeline now compact for free.
  malloc:
    arenaMax: "2"                 # Cap glibc arenas. Cross is .NET-only on the
                                  # hot path but capping prevents the bloat
                                  # failure mode we already cured on agent.
  # Per-agent RPC throttle + circuit breaker. The soft timeout is what catches
  # "agent slow but not erroring" — without it, a wedged-but-alive agent could
  # silently hold throttle slots forever (the failure mode that came back
  # today after yesterday's deadline removal).
  agentThrottle:
    maxInflight: "4"
    maxAttempts: "5"
    breakerFailureThreshold: "5"
    breakerCooldownSec: "30"
    softTimeoutSec: "180"         # 3 minutes per RPC. Healthy BatchGet is
                                  # ~10–400 ms so this never trips real work,
                                  # but turns a wedged call into a breaker
                                  # trip within 3 minutes.
  mosaicDedup:
    enabled: "false"          # Level 2 Mosaic Dedup (set "true" to enable)
    entropyThreshold: "4.0"   # Shannon entropy threshold (bits/byte) for L2 trigger
    topK: "10"                # Top-K candidates from agents for mosaic assembly
  laneSearch:
    enabled: "false"          # Global lane search for L2 mosaic (requires agent laneIndex)
    hashBits: "16"            # Must match agent laneIndex.hashBits
    searchMax: "50"           # Max results per lane query
  ccfStore:
    enabled: "false"          # Cluster-stored CCF mode disabled (clients receive CCFs back directly)
    path: "/data/ccf-store"   # Mount path for CCF storage PVC (unused while disabled)
    backgroundServicesDisabled: "true"  # Cross pods serve requests only (optimizer runs in dedicated pod)
    packThreshold: "100"      # Pack CCFs when this many unpacked CCFs accumulate
    packIntervalSec: "30"     # Optimizer check interval (30s for fast dict training during benchmarks)
    globalCompaction:
      enabled: "true"               # Repack unpacked + selected source packs each cycle (budgeted)
      maxSourcePacksPerCycle: "4"   # More packs per cycle for faster convergence
      maxReadBytesPerCycle: "1073741824"  # 1 GiB read budget per cycle
      maxDurationSec: "90"          # Longer cycles for more throughput
      maxWorkingSetMb: "0"          # Auto-detect: 85% of container memory (48Gi limit → ~40GB ceiling)
      optimizerParallelism: "0"     # 0 = auto (half of CPU cores, max 8)
    persistence:
      enabled: false                # PVC not needed when ccfStore is disabled
      storageClassName: "longhorn"
      size: "100Gi"
  service:
    type: LoadBalancer
    grpcPort: 5000
    httpPort: 5001
    # Pinned MetalLB-assigned IP so the router's port-forward target is stable
    # across redeploys / full namespace tear-downs. Without this MetalLB picks
    # the next free IP from its pool every fresh install, breaking the router
    # config. Make sure this IP is inside the MetalLB pool range and not in
    # use by another service in the same pool.
    loadBalancerIP: "192.168.50.70"
    externalTrafficPolicy: Cluster
    annotations: {}
  # Memory limit for cross was previously absent — managed heap was capped at 5 GB by
  # DOTNET_GCHeapHardLimit but native memory (gRPC buffers, monolithic temp-file reads,
  # Kestrel) could grow without bound, OOM-killing the node. With windowedThresholdMB=16
  # the worst case per request is roughly: (window 16 MB) × (maxConcurrent 2) × overhead
  # for queueing/pipelining ≈ 1–2 GB native + 5 GB managed. 8 GB cgroup limit gives
  # headroom for that plus gRPC connection buffers and crucially makes the cross pod
  # OOM-safe before its node does.
  resources:
    requests:
      cpu: "2000m"
      memory: "2Gi"
    limits:
      cpu: "8000m"
      memory: "8Gi"

ccfOptimizer:
  enabled: true
  replicaCount: 1
  nodeSelector:
    kubernetes.io/hostname: "techpology2"
  resources:
    requests:
      cpu: "4000m"
      memory: "16Gi"
    limits:
      cpu: "16000m"
      memory: "48Gi"

webinterface:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  service:
    type: LoadBalancer
    port: 80
  ingress:
    enabled: false

# Internal command-center: gzip NDJSON journal on a 10Gi PVC, 7-day retention,
# UI exposed via MetalLB LoadBalancer for the operator. Sized small on purpose
# (memory budget targets ≤ 200 Mi at idle).
controlcenter:
  enabled: true
  jobEventsEnabled: true
  resources:
    requests:
      cpu: "200m"
      memory: "128Mi"
    limits:
      cpu: "2000m"
      memory: "512Mi"
  gc:
    conserveMemory: "7"
    heapHardLimit: "0x10000000"   # 256 MB
  persistence:
    storageClassName: "longhorn"
    size: "10Gi"
  uiService:
    type: LoadBalancer
    port: 80
    loadBalancerIP: ""
    annotations: {}

observability:
  enabled: true
  otel:
    endpoint: "http://crossv9-crossv9-otel-collector:4317"
  prometheus:
    image: "prom/prometheus:v2.54.1"
    retention: "7d"
    service:
      type: ClusterIP
      port: 9090
  grafana:
    image: "grafana/grafana:11.1.4"
    adminUser: "admin"
    adminPassword: "admin"
    service:
      type: LoadBalancer
      port: 3000
  tempo:
    image: "grafana/tempo:2.6.1"
  pyroscope:
    image: "grafana/pyroscope:1.12.0"
    service:
      type: ClusterIP
      port: 4040
  alloy:
    image: "grafana/alloy:v1.4.2"

benchrunner:
  enabled: true
  replicaCount: 1
  maxFileSizeGB: 4
  service:
    type: LoadBalancer
    port: 5050
    loadBalancerIP: ""
  resources:
    requests:
      cpu: "1000m"
      memory: "1Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"
