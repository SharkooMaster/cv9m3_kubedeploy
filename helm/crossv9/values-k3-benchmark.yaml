# CrossV9 tuned for the office k8s cluster: 6 nodes (1 control plane +
# 5 workers), ~184 vCPU / ~218 GB RAM total, ~1 TB local m.2 per node.
#
# Rewritten 2026-06-10 to carry over everything learned on Clever Cloud:
#   - BinaryVectorIndex is the search path (L1 bucket cache OFF).
#   - Chunks on local NVMe via emptyDir (localChunks) — durability is
#     R=2 peer replication, same model that survived the CC benchmarks.
#   - Ephemeral-storage declared so kubelet evicts per-pod instead of
#     tainting nodes (the failure that killed the 2026-06-10 CC run).
#   - storeAsync=1, maxConcurrent=8, 64 MB windows, upload cap 200 GiB.
#
# Deploy:
#   helm upgrade --install crossv9 . -f values.yaml -f values-k3-benchmark.yaml -n crossv9 --create-namespace
#
# Client (on the office LAN): point at the cross LoadBalancer
#   192.168.50.70:5000 — Block size 64 MB, MaxConcurrentBlocks 16.

# ── Longhorn (subchart) ──────────────────────────────────────────────────
# Only used for the small control-plane PVCs now (etcd, controlcenter,
# redis). Chunk data does NOT live on Longhorn anymore — it's on each
# node's local m.2 via emptyDir (see agent.localChunks). Replica 3 on
# 1 Gi/10 Gi/20 Gi volumes is cheap.
longhorn:
  enabled: true
  namespaceOverride: "longhorn-system"
  defaultSettings:
    createDefaultDiskLabeledNodes: false
    defaultDataPath: "/var/lib/longhorn/"
    defaultReplicaCount: 3
    replicaAutoBalance: "best-effort"
  persistence:
    defaultClass: true
    defaultClassReplicaCount: 3
    reclaimPolicy: Delete
  service:
    ui:
      type: NodePort

imagePullSecrets: []

images:
  agent:
    repository: "ghcr.io/sharkoomaster/crossv9-agent"
    # BinaryVectorIndex + no-temp-file segment merge + write-batcher pending
    # read-through (ghost/heal storm fix) + 4 KiB chunk default.
    tag: "sha256:63632b5a7befc189ad42f2de036f8056e920bd025b1bba3924e432a464e08822"
    pullPolicy: Always
  cross:
    repository: "ghcr.io/sharkoomaster/crossv9-cross"
    # v7.1.0 entropy-coded error section (stream-separated + zstd, 1-byte
    # mod-256 deltas; ~3-4x smaller error payload) + 4 KiB chunk default.
    tag: "sha256:a773a625ded6daf9ac11a29203c325c2f66153392815b4472824bcfecb8a10ad"
    pullPolicy: Always
  gateway:
    repository: "ghcr.io/sharkoomaster/crossv9-gateway"
    tag: "sha256:71eb0c6f48fcb06a65b68bbd311b89b2bc5e9df586985e7ffa8ab0f5d51eb34c"
    pullPolicy: IfNotPresent
  webinterface:
    repository: "ghcr.io/sharkoomaster/crossv9-webinterface"
    tag: "latest"
    pullPolicy: IfNotPresent
  controlcenter:
    repository: "ghcr.io/sharkoomaster/crossv9-controlcenter"
    tag: "sha256:e9508e3744ee0f064ed7186019ebd8ab8a9c7dda41c330b3a6f2c30d0d5b3836"
    pullPolicy: Always
  benchrunner:
    repository: "ghcr.io/sharkoomaster/crossv9-benchrunner"
    tag: "sha256:3cceb01db546d68172f4c037c2a4b4f05bb05ec980a5a1a1db77a0040fb3ce2e"
    pullPolicy: Always

chunkSize: 4096  # Bytes per chunk (used by agent, cross, gateway). 4 KiB: ~4x fewer chunks/GB than 1 KiB → ~4x less search/store/index/RPC load, traded against coarser match granularity.

mode:
  crossMode: "local"

postgres:
  enabled: false

externalPostgres:
  host: "postgres.postgres.svc.cluster.local"
  port: 5432
  user: "youruser"
  password: "yourpassword"
  database: "yourdbname"

# In-chart Redis (routing/dedup tables). Small persistence volume on
# Longhorn; flushed on every fresh-wipe anyway.
redis:
  enabled: true
  image: "redis:7-alpine"
  port: 6379
  servicePort: 6379
  maxMemory: "8gb"
  maxMemoryPolicy: "allkeys-lru"
  persistence:
    enabled: true
    storageClassName: "longhorn"
    size: "20Gi"
  resources:
    requests:
      memory: "2Gi"
    limits:
      memory: "10Gi"

externalRedis:
  host: ""
  port: 6379

# ── etcd: authoritative agent-membership registry ────────────────────────
etcd:
  enabled: true
  image: "quay.io/coreos/etcd:v3.5.13"
  persistence:
    enabled: true
    storageClassName: "longhorn"
    size: "1Gi"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

agent:
  # StatefulSet: stable identity (crossv9-agent-0 …) because Rendezvous
  # Hashing routes by pod name. 5 agents = 1 per worker node; the 16 Gi
  # memory request prevents the scheduler from packing two agents onto
  # one 32 GB node, so the fleet spreads without podAntiAffinity.
  workloadKind: StatefulSet
  replicaCount: 5
  replicationFactor: 2
  writeQuorum: 2
  vnodesPerAgent: 256
  # Non-blocking store: ack when writes are queued instead of fsyncing the
  # WAL per BatchStore. Safe: chunks are on local NVMe and every chunk is
  # on 2 agents (R=2). The agent still drains synchronously under RocksDB
  # write pressure.
  storeAsync: "1"
  storageBackend: rocksdb
  rocksdb:
    path: "/data/chunks/rocksdb"
  s3:
    endpoint: "http://192.168.50.55:9000"
    bucket: "chunks"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    forcePathStyle: true
    useSsl: false

  # ── BinaryVectorIndex — the search path ──────────────────────────────
  # Off-heap quantized two-stage search: 8 B/vector RAM for sealed
  # segments, sub-µs candidate scans, mmap-backed payloads on the local
  # m.2. Replaces the L1 M_Bucket cache entirely (l1CacheEnabled=false):
  # the L1 path was the eviction-cliff failure mode — RAM scaled linearly
  # with corpus until searches fell off a cliff into RocksDB seeks.
  binaryIndex:
    enabled: "true"
    segmentCapacity: "2000000"
  l1CacheEnabled: "false"

  bucketCache:
    # Not on the search hot path anymore (binary index replaces it).
    # Keep a small budget for residual callers.
    maxGb: "2"
    evictionIntervalSec: 10
    highWaterPct: "0.90"
    lowWaterPct: "0.75"
    hardCeilingPct: "0.98"
  chunkCache:
    # Byte-cache for dedup hits / base-chunk fetches. 6 GiB per agent —
    # generous because StoreChunks/BatchGet chunk-byte I/O is the next
    # bottleneck after the index fix.
    sizeMb: 6144
    ttlMinutes: 60
  laneIndex:
    enabled: "false"
    hashBits: "16"
    searchMax: "50"

  # ── Chunks on local m.2 (emptyDir), NOT Longhorn ─────────────────────
  # Every random read is a local NVMe op instead of a network round-trip.
  # Durability = R=2 peer replication: a single-pod restart wipes that
  # pod's slice and rebalance rebuilds it from the surviving peer. The
  # BinaryVectorIndex rebuilds itself from RocksDB on startup.
  localChunks:
    enabled: true
    # Sized to the SMALLEST worker (techpology2/3: ~432 GiB allocatable).
    # 350 Gi keeps node free space above kubelet's 10% disk-pressure
    # threshold even on those nodes; the bigger nodes just have headroom.
    # Fleet capacity at R=2 ≈ 5 × 350 / 2 = ~875 GiB unique — far beyond
    # the 133 GB benchmark even at 0% dedup.
    sizeLimit: "350Gi"
  # persistence block kept for template compatibility — with
  # localChunks.enabled=true no chunks PVC is rendered.
  persistence:
    enabled: true
    storageClassName: "longhorn"
    size: "60Gi"
    hostPath: "/var/lib/crossv9/chunks"
  cephBackup:
    enabled: false

  # Sized for 32 GB workers (~30 vCPU each). The emptyDir counts toward
  # pod ephemeral-storage — declare it so kubelet evicts THIS pod
  # predictably when disk fills, instead of tainting the whole node
  # (the failure that killed the 2026-06-10 Clever Cloud run).
  resources:
    requests:
      cpu: "4000m"
      memory: "16Gi"
      ephemeral-storage: "200Gi"
    limits:
      cpu: "24000m"
      memory: "26Gi"
      ephemeral-storage: "350Gi"

  # GC: heapHardLimit is what the cache auto-sizer reads — NOT the cgroup
  # limit. 16 GiB managed cap inside the 26 GiB cgroup leaves ~10 GiB for
  # RocksDB block cache, memtables, mmap and glibc.
  gc:
    conserveMemory: "5"
    heapHardLimit: "0x400000000" # 16 GiB
    retainVm: "1"
    lohThreshold: "262144"
  malloc:
    arenaMax: "2"
  counterCache:
    capacity: "1000000"
    shards: "64"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

  pdb:
    enabled: true
  antiEntropyEnabled: "false"
  antiEntropyAutoRepair: "false"
  # Fixed 5-agent fleet — no HPA, no drain choreography needed.
  hpa:
    enabled: false
  retirement:
    enabled: false

gateway:
  replicaCount: 3
  searchTimeoutSec: 30
  storeTimeoutSec: 45
  streamConcurrency: 100
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"
  hpa:
    enabled: false
  pdb:
    enabled: true

gatewayCoordinator:
  enabled: true
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

cross:
  replicaCount: 3
  windowedThresholdMB: 64
  windowSizeMB: 64
  integrityDecompressSmoketest: false
  # 133 GB benchmark file must fit under this cap.
  maxUploadBytes: "214748364800"  # 200 GiB
  # 8 concurrent windows per pod × 3 pods = 24 in flight — pairs with
  # client MaxConcurrentBlocks=16 leaving headroom for queueing.
  maxConcurrent: 8
  pipelineParallelism: 4
  searchTopK: 10
  gc:
    conserveMemory: "5"
    heapHardLimit: "0x140000000"  # 5 GiB managed; cgroup limit 8 Gi
    retainVm: "1"
    lohThreshold: "262144"
  malloc:
    arenaMax: "2"
  agentThrottle:
    maxInflight: "6"
    maxAttempts: "5"
    breakerFailureThreshold: "5"
    breakerCooldownSec: "30"
    softTimeoutSec: "180"
  mosaicDedup:
    enabled: "false"
    entropyThreshold: "4.0"
    topK: "10"
  laneSearch:
    enabled: "false"
    hashBits: "16"
    searchMax: "50"
  ccfStore:
    enabled: "false"
    path: "/data/ccf-store"
    backgroundServicesDisabled: "true"
    packThreshold: "100"
    packIntervalSec: "30"
    globalCompaction:
      enabled: "true"
      maxSourcePacksPerCycle: "4"
      maxReadBytesPerCycle: "1073741824"
      maxDurationSec: "90"
      maxWorkingSetMb: "0"
      optimizerParallelism: "0"
    persistence:
      enabled: false
      storageClassName: "longhorn"
      size: "100Gi"
  service:
    # NodePort instead of MetalLB LoadBalancer: MetalLB L2 announcements
    # aren't reaching the office LAN (router/clients can't ARP the VIP),
    # while NodePort binds on every node's real IP — client just targets
    # any node, e.g. the control plane: 192.168.50.51:30500 (gRPC).
    type: NodePort
    grpcPort: 5000
    httpPort: 5001
    grpcNodePort: 30500
    httpNodePort: 30501
    annotations: {}
  hpa:
    enabled: false
  pdb:
    enabled: true
  resources:
    requests:
      cpu: "2000m"
      memory: "2Gi"
    limits:
      cpu: "8000m"
      memory: "8Gi"

# ccfStore is disabled, so the optimizer would just idle while its 16 Gi
# request blocks an agent from the techpology2 node. Off until ccfStore
# comes back.
ccfOptimizer:
  enabled: false
  replicaCount: 1
  nodeSelector:
    kubernetes.io/hostname: "techpology2"
  resources:
    requests:
      cpu: "4000m"
      memory: "16Gi"
    limits:
      cpu: "16000m"
      memory: "48Gi"

webinterface:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  service:
    type: LoadBalancer
    port: 80
  ingress:
    enabled: false

# Journal (perf_sample + job_event NDJSON) — this is what we download
# after every run for analysis. Keep it on.
controlcenter:
  enabled: true
  jobEventsEnabled: true
  resources:
    requests:
      cpu: "200m"
      memory: "128Mi"
    limits:
      cpu: "2000m"
      memory: "512Mi"
  gc:
    conserveMemory: "7"
    heapHardLimit: "0x10000000"   # 256 MB
  persistence:
    storageClassName: "longhorn"
    size: "10Gi"
  uiService:
    # NodePort for the same MetalLB-unreachability reason as cross.
    # UI: http://192.168.50.51:30580
    type: NodePort
    port: 80
    nodePort: 30580
    annotations: {}

observability:
  enabled: true
  otel:
    endpoint: "http://crossv9-crossv9-otel-collector:4317"
  prometheus:
    image: "prom/prometheus:v2.54.1"
    retention: "7d"
    service:
      type: ClusterIP
      port: 9090
  grafana:
    image: "grafana/grafana:11.1.4"
    adminUser: "admin"
    adminPassword: "admin"
    service:
      type: LoadBalancer
      port: 3000
  tempo:
    image: "grafana/tempo:2.6.1"
  pyroscope:
    image: "grafana/pyroscope:1.12.0"
    service:
      type: ClusterIP
      port: 4040
  alloy:
    image: "grafana/alloy:v1.4.2"

benchrunner:
  enabled: true
  replicaCount: 1
  maxFileSizeGB: 4
  service:
    type: LoadBalancer
    port: 5050
    loadBalancerIP: ""
  resources:
    requests:
      cpu: "1000m"
      memory: "1Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"
