# CrossV9 tuned baseline for a 5-node k3 cluster.
# Replace image repositories and secret values before deploy.

imagePullSecrets: []

images:
  agent:
    repository: "ghcr.io/sharkoomaster/crossv9-agent"
    tag: "sha256:b3baa865fb365c153696e7cb559dfdb911218a5a2727904ca9608ea8013059c2"
    pullPolicy: IfNotPresent
  gateway:
    repository: "ghcr.io/sharkoomaster/crossv9-gateway"
    tag: "sha256:cd45cfc984d135e75a17421725f55e2361c83495e19fb46fc3e7db17e1d4756f"
    pullPolicy: IfNotPresent
  cross:
    repository: "ghcr.io/sharkoomaster/crossv9-cross"
    tag: "sha256:e648d03c9a503b12cc2721e8e6e69452d436cba389e80939ffddff800e0b3fca"
    pullPolicy: IfNotPresent
  webinterface:
    repository: "ghcr.io/sharkoomaster/crossv9-webinterface"
    tag: "latest"
    pullPolicy: IfNotPresent

chunkSize: 1024  # Bytes per chunk (used by agent, cross, gateway)

mode:
  crossMode: "local"

postgres:
  enabled: false

externalPostgres:
  # Matches running postgres pod env:
  # POSTGRES_DB=yourdbname
  # POSTGRES_USER=youruser
  # POSTGRES_PASSWORD=yourpassword
  host: "postgres.postgres.svc.cluster.local"
  port: 5432
  user: "youruser"
  password: "yourpassword"
  database: "yourdbname"

redis:
  enabled: true
  image: "redis:7-alpine"
  port: 6379
  servicePort: 6379
  maxMemory: "30gb"
  maxMemoryPolicy: "allkeys-lru"
  persistence:
    enabled: true
    storageClassName: "local-path"
    size: "200Gi"
  resources:
    requests:
      memory: "8Gi"
    limits:
      memory: "16Gi"

externalRedis:
  host: ""
  port: 6379

agent:
  workloadKind: DaemonSet
  storageBackend: rocksdb
  rocksdb:
    path: "/data/chunks/rocksdb"
  replicationFactor: 2  # Replicate to 2 other agents (3 total including self)
  s3:
    endpoint: "http://192.168.50.55:9000"
    bucket: "chunks"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    forcePathStyle: true
    useSsl: false
  bucketCache:
    maxGb: 12            # L1 RAM cap for bucket vectors (search data). Cold buckets on L2 (RocksDB disk).
    evictionIntervalSec: 10  # How often the LRU evictor runs
  chunkCache:
    sizeMb: 4096         # LRU cache for chunk bytes (decompression). Separate from bucket cache.
    ttlMinutes: 60
  persistence:
    enabled: true
    hostPath: "/var/lib/crossv9/chunks"  # DaemonSet uses hostPath (each node gets its own dir)
    storageClassName: "local-path"  # only used when workloadKind != DaemonSet
    size: "400Gi"
  maxConcurrent: 4  # Max concurrent compress/decompress per Cross pod (prevents OOM)
  resources:
    requests:
      memory: "8Gi"
    limits:
      memory: "12Gi"

gateway:
  replicaCount: 4
  # High-throughput settings for 152 CPU cores and 155GB RAM
  searchTimeoutSec: 30
  storeTimeoutSec: 45
  streamConcurrency: 200  # High concurrency for I/O-bound queries
  resources:
    requests:
      memory: "4Gi"
    limits:
      memory: "12Gi"

cross:
  replicaCount: 4
  windowedThresholdMB: 256    # Files > this use v4.0.0 windowed compression (0 = always monolithic)
  windowSizeMB: 16            # Window size for v4.0.0 windowed compression
  maxUploadBytes: "107374182400"  # 100 GiB max upload (windowed handles RAM)
  service:
    type: LoadBalancer
    grpcPort: 5000
    httpPort: 5001
    loadBalancerIP: ""
    externalTrafficPolicy: Cluster
    annotations: {}
  resources:
    requests:
      memory: "4Gi"
    limits:
      memory: "12Gi"

webinterface:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  service:
    type: LoadBalancer
    port: 80
  ingress:
    enabled: false

observability:
  enabled: true
  otel:
    endpoint: "http://crossv9-crossv9-otel-collector:4317"
  prometheus:
    image: "prom/prometheus:v2.54.1"
    retention: "7d"
    service:
      type: ClusterIP
      port: 9090
  grafana:
    image: "grafana/grafana:11.1.4"
    adminUser: "admin"
    adminPassword: "admin"
    service:
      type: LoadBalancer
      port: 3000
  tempo:
    image: "grafana/tempo:2.6.1"
  pyroscope:
    image: "grafana/pyroscope:1.12.0"
    service:
      type: ClusterIP
      port: 4040
  alloy:
    image: "grafana/alloy:v1.4.2"
