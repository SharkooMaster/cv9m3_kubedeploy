# Default values for crossv9.

global:
  nameOverride: ""
  fullnameOverride: ""

imagePullSecrets: []

images:
  # Set these to your registry for cluster pulls (or load images into kind).
  agent:
    repository: "dockerdeploy-agent-1"
    tag: "latest"
    pullPolicy: IfNotPresent
  gateway:
    repository: "dockerdeploy-gateway"
    tag: "latest"
    pullPolicy: IfNotPresent
  cross:
    repository: "dockerdeploy-cross"
    tag: "latest"
    pullPolicy: IfNotPresent
  webinterface:
    repository: "dockerdeploy-webinterface"
    tag: "latest"
    pullPolicy: IfNotPresent

mode:
  # IMPORTANT:
  # - "local" forces services to bypass DHT routing and use service discovery.
  # - "distributed" enables DHT routing (requires stable agent addressing/bootstrapping).
  crossMode: "local"

postgres:
  enabled: true
  image: "postgres:15-alpine"
  database: "compressiondb"
  user: "crossuser"
  password: "crosspass"
  port: 5432
  servicePort: 5432
  persistence:
    enabled: false
    storageClassName: ""
    size: 10Gi

# Used when postgres.enabled=false (e.g. RDS)
externalPostgres:
  host: ""
  port: 5432
  user: ""
  password: ""
  database: "compressiondb"

agent:
  workloadKind: Deployment # Deployment or DaemonSet
  replicaCount: 3
  resources: {}
  storageBackend: local # local, s3, gcs, rocksdb
  rocksdb:
    path: "/data/chunks/rocksdb"
  s3:
    endpoint: ""
    bucket: ""
    accessKey: ""
    secretKey: ""
    forcePathStyle: true
    useSsl: false
  chunkCache:
    sizeMb: 512
    ttlMinutes: 30
  persistence:
    enabled: false
    storageClassName: ""
    size: 20Gi

gateway:
  replicaCount: 1
  searchTimeoutSec: 20
  storeTimeoutSec: 30
  streamConcurrency: 8
  resources: {}

cross:
  replicaCount: 1
  service:
    type: ClusterIP
    grpcPort: 5000
    httpPort: 5001
    loadBalancerIP: ""
    externalTrafficPolicy: Cluster
    annotations: {}
  resources: {}

webinterface:
  replicaCount: 1
  resources: {}
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: "crossv9.local"
        paths:
          - path: /
            pathType: Prefix

observability:
  enabled: true
  otel:
    endpoint: "http://crossv9-crossv9-otel-collector:4317"
  prometheus:
    image: "prom/prometheus:v2.54.1"
    retention: "7d"
    service:
      type: ClusterIP
      port: 9090
  grafana:
    image: "grafana/grafana:11.1.4"
    adminUser: "admin"
    adminPassword: "admin"
    service:
      type: ClusterIP
      port: 3000
  tempo:
    image: "grafana/tempo:2.6.1"
  pyroscope:
    image: "grafana/pyroscope:1.12.0"
    service:
      type: ClusterIP
      port: 4040
  alloy:
    image: "grafana/alloy:v1.4.2"


