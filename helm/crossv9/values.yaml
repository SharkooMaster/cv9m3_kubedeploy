# Default values for crossv9.

global:
  nameOverride: ""
  fullnameOverride: ""

# ── Dev tooling shortcuts ────────────────────────────────────────────────
# These exist so the inner-loop "wipe and restart" cycle stays fast in
# development without needing to touch the structural workloadKind /
# persistence values.
dev:
  # When true, agent pods mount an emptyDir for /data/chunks instead of
  # PVCs — even under StatefulSet. That trades durability for speed: every
  # pod restart wipes data and there's no PVC provisioning delay. Pair
  # with `POST /admin/cluster/wipe` on cross to reset etcd membership and
  # pod chunk stores in one step. NEVER enable in production.
  fastReset: false

# ── Longhorn subchart ────────────────────────────────────────────────────
# Bundled as a dependency in Chart.yaml. When enabled, our chart installs
# Longhorn into the same release alongside the application. Disable this
# (set longhorn.enabled=false) when:
#   - Longhorn is already installed by another helm release / kustomize.
#   - The cluster uses a different storage class (and you've set
#     agent.persistence.storageClassName accordingly).
#
# Values under `longhorn:` are forwarded directly to the upstream Longhorn
# chart — see https://github.com/longhorn/longhorn/tree/master/chart for
# the full reference. The few defaults we override here are the ones that
# matter for the crossv9 agent StatefulSet to work cleanly out of the box.
longhorn:
  enabled: false   # opt-in by default; set true in environments where we own storage
  # Pin Longhorn to its conventional namespace even when the parent chart
  # (crossv9) lives elsewhere. This keeps Longhorn's webhooks, CRD watchers,
  # and instance manager pods isolated from application workloads — and
  # matches everyone else's tutorials/docs that assume `longhorn-system`.
  namespaceOverride: "longhorn-system"
  defaultSettings:
    # Use disks on every Longhorn-managed node (storage pool = whole cluster).
    # The user-visible knob is per-node `allowScheduling` — this default
    # combined with createDefaultDiskLabeledNodes=false enables disks on
    # every node Longhorn discovers, instead of waiting for a label.
    createDefaultDiskLabeledNodes: false
    # Where each node keeps its replica data. Stable, predictable path so
    # disk-wipe scripts know what to clean.
    defaultDataPath: "/var/lib/longhorn/"
    # 3 replicas is Longhorn's default and the right number once all 6
    # cluster nodes are storage nodes. Lower it (e.g. 2) if you'll only
    # ever have <3 storage nodes.
    defaultReplicaCount: 3
    # Auto-rebalance volumes across nodes when topology changes.
    replicaAutoBalance: "best-effort"
  persistence:
    defaultClass: true
    defaultClassReplicaCount: 3
    reclaimPolicy: Delete
  service:
    ui:
      # NodePort gives the UI a stable port across all nodes — hit any
      # node IP on the assigned 3xxxx port. No port-forward needed.
      type: NodePort

imagePullSecrets: []

images:
  # Set these to your registry for cluster pulls (or load images into kind).
  agent:
    repository: "dockerdeploy-agent-1"
    tag: "latest"
    pullPolicy: IfNotPresent
  gateway:
    repository: "dockerdeploy-gateway"
    tag: "latest"
    pullPolicy: IfNotPresent
  cross:
    repository: "dockerdeploy-cross"
    tag: "latest"
    pullPolicy: IfNotPresent
  webinterface:
    repository: "dockerdeploy-webinterface"
    tag: "latest"
    pullPolicy: IfNotPresent
  controlcenter:
    repository: "dockerdeploy-controlcenter"
    tag: "latest"
    pullPolicy: IfNotPresent

mode:
  # IMPORTANT:
  # - "local" forces services to bypass DHT routing and use service discovery.
  # - "distributed" enables DHT routing (requires stable agent addressing/bootstrapping).
  crossMode: "local"

postgres:
  enabled: true
  image: "postgres:15-alpine"
  database: "compressiondb"
  user: "crossuser"
  password: "crosspass"
  port: 5432
  servicePort: 5432
  persistence:
    enabled: false
    storageClassName: ""
    size: 10Gi

# Used when postgres.enabled=false (e.g. RDS)
externalPostgres:
  host: ""
  port: 5432
  user: ""
  password: ""
  database: "compressiondb"

redis:
  enabled: true
  image: "redis:7-alpine"
  port: 6379
  servicePort: 6379
  maxMemory: "2gb"
  maxMemoryPolicy: "allkeys-lru"
  persistence:
    enabled: true
    storageClassName: ""
    size: 10Gi
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# Used when redis.enabled=false (e.g. external Redis)
externalRedis:
  host: ""
  port: 6379

# ── etcd ──────────────────────────────────────────────────────────────────
# Single-pod authoritative agent membership registry.
#
# Why: Cross's RendezvousRouter used to build its agent list from per-pod
# DNS+GetNodeInfo polling. That polling was independent per cross pod and
# could drift ~15 s, sending the same (BucketId, BucketKey) to different
# agents from two cross pods → silent decompress corruption. With etcd,
# every cross pod sees the same linearised stream of agent-membership
# events, so routing decisions are globally consistent.
#
# Membership working set is ~6 keys × ~200 B → < 2 KB total. A single etcd
# pod with a tiny PVC is plenty. Disable if you want to plug in your own
# etcd cluster — just set externalEtcd.endpoints and etcd.enabled=false.
etcd:
  enabled: true
  image: "quay.io/coreos/etcd:v3.5.13"
  persistence:
    enabled: true
    storageClassName: ""    # use cluster default; set to "longhorn" for HA
    size: "1Gi"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# Used when etcd.enabled=false (point at your own etcd cluster).
# Example: "http://my-etcd.default.svc.cluster.local:2379"
externalEtcd:
  endpoint: ""

agent:
  # workloadKind: Deployment | StatefulSet | DaemonSet
  #
  # StatefulSet (RECOMMENDED for any environment that has Longhorn or another
  #   per-pod RWO storage class):
  #     - Each replica gets a stable pod name (agent-0, agent-1, ...) and its
  #       own RWO PVC via volumeClaimTemplates. The volume follows the pod
  #       across node reschedules, so chunks remain reachable on the agent
  #       that stored them regardless of which node hosts it.
  #     - Rendezvous Hashing (cross/gateway) routes by pod name, so the
  #       routing key is stable across reschedules. This is the only mode
  #       that's safe against silent decompress corruption when the cluster
  #       topology changes.
  #
  # DaemonSet (one pod per node, hostPath storage):
  #     - Simpler but the storage is tied to the K8s node. Any pod-to-node
  #       move re-hashes ~1/N buckets to a different agent that doesn't have
  #       the chunks → silent corruption at decompress. Only use this if
  #       your nodes never move and never reschedule.
  #
  # Deployment (single shared PVC):
  #     - Only works with an RWX storage class. RocksDB does not tolerate
  #       multiple writers on the same files, so this mode is effectively
  #       limited to replicaCount=1.
  # Default flipped to StatefulSet for the replicated-routing architecture.
  # The consistent-hash ring uses pod names (agent-0, agent-1, ...) as
  # vnode owners; only StatefulSets give those names stable identities
  # that survive reschedules. With Deployment, a pod restart re-assigns
  # vnodes and triggers a needless rebalance.
  workloadKind: StatefulSet
  # 5 = R=3 replicas + 2 spare → a single agent failure leaves a healthy
  # ring; a two-agent failure still keeps R=3 quorum reachable for most
  # buckets. Bump higher for larger working sets.
  replicaCount: 5
  resources: {}
  # ── Replication knobs (read by cross/gateway via env) ──
  # replicationFactor: how many copies of each chunk live across agents
  # writeQuorum: minimum acks required for a write to be considered durable
  # vnodesPerAgent: spread per agent on the consistent-hash ring (higher
  #   = smoother load distribution, modest memory cost). Communicated to
  #   cross/gateway via /agents/<podName>.vnodes; agents publish this
  #   value when they self-register in etcd.
  replicationFactor: 3
  writeQuorum: 2
  vnodesPerAgent: 256
  # storageBackend selects which INetworkFileStorageService the agent
  # instantiates at startup. 'rocksdb' is the only mode that keeps
  # bucket metadata and chunk bytes co-located in a single embedded
  # store; every other mode (local/s3/gcs) routes bucket-key allocation
  # through Postgres via INSERT INTO bucket_keys, which (a) blocks
  # writes on a single Npgsql pool and tanks throughput at scale, and
  # (b) requires a Postgres schema bootstrap that the chart doesn't
  # ship — i.e. it's broken out of the box.
  storageBackend: rocksdb # local, s3, gcs, rocksdb
  rocksdb:
    path: "/data/chunks/rocksdb"
  s3:
    endpoint: ""
    bucket: ""
    accessKey: ""
    secretKey: ""
    forcePathStyle: true
    useSsl: false
  chunkCache:
    sizeMb: 512
    ttlMinutes: 30
  # Bounded counter cache for `bnext:{bucketId}` — keeps managed RAM constant
  # regardless of total bucket count. See agent/src/Services/Storage/BoundedCounterCache.cs.
  counterCache:
    capacity: "1000000"
    shards: "64"
  # GC + liveness tuning. Lower conserveMemory keeps GC pauses short enough that the
  # liveness probe doesn't trip during bursts; the longer probe interval gives the
  # agent breathing room during compactions.
  gc:
    conserveMemory: "5"
    heapHardLimit: "0x100000000"   # 4 GiB managed heap cap; rest of cgroup for RocksDB + glibc
    retainVm: "1"                  # Keep retired Gen2 segments — pairs with 1-min Forced LOH timer
    lohThreshold: "262144"         # 256 KB — push mid-size arrays off the LOH onto compactable Gen0/1
  malloc:
    arenaMax: "2"                  # Cap glibc arenas to stop RocksDB native-heap sprawl
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6
  persistence:
    enabled: false
    storageClassName: ""
    size: 20Gi
  # PodDisruptionBudget — protects R=3 quorum during voluntary
  # disruptions (node drains, rolling upgrades). Off by default;
  # enable in production overlays.
  pdb:
    enabled: false
    # maxUnavailable: 1   # default if unset
  # Anti-entropy toggles (read at agent startup; see
  # AntiEntropyService for the algorithm). Off by default.
  antiEntropyEnabled: "false"
  antiEntropyAutoRepair: "false"

  # ── Drain-on-scale-down (HPA safety) ─────────────────────────────────
  # When retirement.enabled=true, the agent pod gets:
  #   - A preStop hook that calls POST /admin/retire on localhost:5001
  #     and blocks until the gateway confirms every vnode this pod owned
  #     has been copied to a surviving peer.
  #   - terminationGracePeriodSeconds = retirement.timeoutSeconds, so the
  #     kubelet gives the drain hook the headroom to actually finish.
  #
  # This is the safety contract that makes HPA on a StatefulSet OK: the
  # agent will not terminate until R=3 is restored. Off by default
  # because in dev the 600s grace makes "kubectl delete pod" feel slow;
  # turn it on for any production deployment, especially with
  # agent.hpa.enabled=true.
  retirement:
    enabled: false
    timeoutSeconds: 600  # 10 minutes — enough for a few-GB store to fan out

  # ── Horizontal Pod Autoscaler ────────────────────────────────────────
  # CPU is the wrong signal for agents (they're I/O-bound on RocksDB,
  # not CPU). Memory tracks the bucket cache + chunk cache + LSM index
  # blocks, which all grow with stored data — making it a reasonable
  # proxy for "this pod is running out of capacity, add another".
  #
  # Critical: only enable this with retirement.enabled=true. Without the
  # drain hook, an HPA scale-down can SIGTERM a pod before its vnodes
  # have been copied elsewhere → R drops below the write quorum → data
  # loss on a single subsequent failure.
  hpa:
    enabled: false
    minReplicas: 3   # never go below R=3
    maxReplicas: 10
    # Memory-based: when the average pod memory utilisation crosses this
    # %, k8s adds another agent ordinal. Tune lower (60-65%) for
    # write-heavy workloads where bucket cache fills fast.
    targetMemoryUtilizationPercentage: 70
    # Conservative scale-down: only remove a pod every 5 minutes and at
    # most 1 at a time. Combined with the drain hook this gives the
    # cluster plenty of time to absorb the leaving pod's data before
    # the next scale-down event.
    scaleDownStabilizationWindowSeconds: 300
    scaleDownMaxPodsPerMinute: 1

gateway:
  replicaCount: 1
  searchTimeoutSec: 20
  storeTimeoutSec: 30
  streamConcurrency: 8
  resources: {}
  # Used only when gatewayCoordinator.enabled=false (split mode off).
  # When the split coordinator is on, the helper template ignores
  # this value and forces "true" on the coordinator pod / "false" on
  # the request-path pods. Keeping it for the small-deployment legacy
  # case (replicaCount=1, no HPA) where a single pod handles both.
  rebalanceCoordinatorEnabled: "true"
  pdb:
    enabled: false

  # ── Horizontal Pod Autoscaler ────────────────────────────────────────
  # CPU-target HPA for the request-handling gateway Deployment.
  # Gateway is CPU-bound during fan-out (compression tail, gRPC
  # serialization, write-quorum collection), so CPU% tracks load.
  #
  # CRITICAL: enabling this requires gatewayCoordinator.enabled=true.
  # The chart enforces this at template render time — without the
  # coordinator split, multi-replica scaling produces racing
  # coordinators and the agent's drain poll can land on a pod with
  # stale tracker state, letting the pod terminate before R is
  # restored. See gateway-hpa.yaml for the full reasoning.
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationWindowSeconds: 300

# ── Singleton Rebalance Coordinator (split deployment) ────────────────
# When enabled, the chart spins up a dedicated single-replica
# Deployment + Service named "<release>-gateway-coordinator". That pod
# is the only one running RebalanceCoordinator and holding
# RetirementTracker state. The agent's GATEWAY_HTTP_URL is rewritten
# to this dedicated service so /admin/retirement-status polls always
# reach the authoritative pod.
#
# Why the split is mandatory under HPA:
#   The tracker is in-memory and per-pod. Multiple coordinator pods
#   independently dispatch handoffs and independently track them; an
#   agent's drain poll could be load-balanced to a pod that never
#   observed the drain and return complete=true → premature exit.
#   Splitting confines tracker state to one pod and pinning the agent
#   to it kills the race entirely.
#
# Trade-off:
#   The coordinator pod is single-replica → a restart loses tracker
#   state. With anti-entropy enabled the cluster recovers; without
#   it, a drain in flight at the moment of restart sees "not tracked"
#   and may exit early. Long-term fix: persist tracker state in etcd.
gatewayCoordinator:
  enabled: false
  # Inherits gateway.resources by default. Override here if the
  # coordinator pod needs different sizing (it shouldn't — it does
  # exactly what one gateway pod does).
  resources: {}

cross:
  replicaCount: 1
  # Horizontal Pod Autoscaler for cross. Off by default — turn on to
  # let the cluster scale cross between minReplicas and maxReplicas
  # based on CPU. With NGINX-Ingress's gRPC stream-level round-robin
  # in front of cross (see cross.ingress below), client connections
  # spread evenly across pods automatically.
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationSeconds: 300
  # gRPC ingress for cross. Without an ingress, a single LoadBalancer
  # service pins external clients to one cross pod (HTTP/2 multiplexes
  # all RPCs onto one TCP connection per client). NGINX-Ingress with
  # backend-protocol=GRPC does HTTP/2 stream-level round-robin across
  # cross pods, which is what makes the HPA actually do anything.
  ingress:
    enabled: false
    className: "nginx"
    host: ""        # e.g. "cross.example.com"
    annotations: {} # populated by values-clevercloud.yaml etc.
    tls: []         # entries: [{ secretName, hosts: [...] }]
  pdb:
    enabled: false
  windowedThresholdMB: 256
  windowSizeMB: 64
  maxUploadBytes: "107374182400"
  maxConcurrent: 4
  pipelineParallelism: 4
  searchTopK: 10
  gc:
    conserveMemory: "5"           # 0..9, lower = fewer pauses (was 9 → triggered stalls)
    heapHardLimit: "0x140000000"  # 5 GB managed heap cap (native is bounded by cgroup)
    retainVm: "1"                 # Keep retired segments; pairs with the 1-min Forced LOH timer
    lohThreshold: "262144"        # 256 KB — most per-block arrays compact for free at this threshold
  malloc:
    arenaMax: "2"                 # Cap glibc arenas
  agentThrottle:
    maxInflight: "4"
    maxAttempts: "5"
    breakerFailureThreshold: "5"
    breakerCooldownSec: "30"
    softTimeoutSec: "180"         # Synthetic-failure deadline for wedged-but-alive agents
  ccfStore:
    enabled: "false"
    path: "/data/ccf-store"
    backgroundServicesDisabled: "false"
    packThreshold: "100"
    packIntervalSec: "300"
    globalCompaction:
      enabled: "false"
      maxSourcePacksPerCycle: "2"
      maxReadBytesPerCycle: "536870912"
      maxDurationSec: "45"
      maxWorkingSetMb: "0"
      optimizerParallelism: "0"
    persistence:
      enabled: false
      storageClassName: ""
      size: "50Gi"
  service:
    type: ClusterIP
    grpcPort: 5000
    httpPort: 5001
    loadBalancerIP: ""
    externalTrafficPolicy: Cluster
    annotations: {}
  resources: {}

ccfOptimizer:
  enabled: false
  replicaCount: 1
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources: {}

webinterface:
  replicaCount: 1
  resources: {}
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: "crossv9.local"
        paths:
          - path: /
            pathType: Prefix

# Internal command-center dashboard. Single pod, RWO PVC for the gzip NDJSON
# event journal, 7-day retention. Cross pods stream JobEvents into the
# ClusterIP service; the operator hits the LoadBalancer service for the UI.
controlcenter:
  enabled: true
  jobEventsEnabled: true
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  gc:
    conserveMemory: "7"
    heapHardLimit: "0x10000000"   # 256 MB managed heap cap
  persistence:
    storageClassName: ""
    size: "10Gi"
  uiService:
    type: LoadBalancer
    port: 80
    loadBalancerIP: ""
    annotations: {}

observability:
  enabled: true
  otel:
    endpoint: "http://crossv9-crossv9-otel-collector:4317"
  prometheus:
    image: "prom/prometheus:v2.54.1"
    retention: "7d"
    service:
      type: ClusterIP
      port: 9090
  grafana:
    image: "grafana/grafana:11.1.4"
    adminUser: "admin"
    adminPassword: "admin"
    service:
      type: ClusterIP
      port: 3000
  tempo:
    image: "grafana/tempo:2.6.1"
  pyroscope:
    image: "grafana/pyroscope:1.12.0"
    service:
      type: ClusterIP
      port: 4040
  alloy:
    image: "grafana/alloy:v1.4.2"


