# Clever Cloud Kubernetes Engine overlay.
#
# Apply on top of the default values.yaml, e.g.:
#   helm install cross . -f values.yaml -f values-clevercloud.yaml
#
# Most of these knobs are placeholders we fill in once we have the
# Clever Cloud cluster in front of us — `kubectl get sc`,
# `kubectl get ingressclass`, and the LB controller's annotation
# vocabulary (typically inherited from the upstream NGINX-Ingress).
#
# What's intentionally already set:
#   - Replicated agent fleet (StatefulSet, R=3).
#   - HPA + ingress on cross to spread external client load.
#   - PDBs everywhere so Clever's node maintenance can't drop
#     replicas faster than the rebalance coordinator can react.
#   - etcd kept single-pod (membership-only data; trade complexity
#     for the small risk of brief unavailability during etcd pod
#     reschedules).

global:
  fullnameOverride: "crossv9"

# Longhorn isn't shipped here — Clever Cloud provides its own CSI.
# Set storageClassName below to whatever `kubectl get sc` reports.
longhorn:
  enabled: false

# ── etcd (membership) ───────────────────────────────────────────────
etcd:
  enabled: true
  persistence:
    enabled: true
    storageClassName: ""    # TODO(clevercloud): set to the cluster's CSI class
    size: "1Gi"

# ── Postgres + Redis ────────────────────────────────────────────────
# Postgres is intentionally OFF on Clever Cloud: the agent storage
# backend is RocksDB, no service in the live deployment opens a
# postgres connection, and the bundled DB was just burning a 20Gi
# PVC + ~256Mi RAM for nothing. If a future workload needs SQL,
# point it at a managed Clever Cloud Postgres add-on via the
# externalPostgres block in values.yaml.
postgres:
  enabled: false

redis:
  persistence:
    enabled: true
    storageClassName: ""    # TODO(clevercloud)
    size: 20Gi

# ── Agent: replicated fleet on StatefulSet ──────────────────────────
agent:
  workloadKind: StatefulSet
  replicaCount: 3            # R=3 + 0 spare; HPA grows the fleet when memory rises
  replicationFactor: 3
  writeQuorum: 2
  vnodesPerAgent: 256
  # RocksDB is the only backend that keeps bucket metadata and chunk
  # bytes in a single embedded store. The other backends require
  # Postgres on the chunk write path, which neither scales nor
  # bootstraps cleanly in this chart.
  storageBackend: rocksdb
  # Sized for the dedicated `agents` CKE nodegroup (S flavor:
  # 8 vCPU / ~11.3 GiB allocatable per node). Memory request is
  # deliberately set high (5 GiB) to make 1 agent fit per S node —
  # k8s scheduler can't pack two requests of 5 GiB into 11.3 GiB,
  # so the StatefulSet spreads naturally across the 3-node pool
  # without needing a podAntiAffinity rule. CPU request gives
  # RocksDB compaction a guaranteed slice; the 6-core limit lets
  # bursts (heavy LSM compaction, GC) consume the rest of the
  # node when no other agent is sharing it.
  resources:
    requests:
      cpu: "1500m"
      memory: "5Gi"
    limits:
      cpu: "6000m"
      memory: "8Gi"
  persistence:
    enabled: true
    storageClassName: ""    # TODO(clevercloud): block volume CSI class
    size: 50Gi
  pdb:
    enabled: true
    # maxUnavailable: 1     # default protects R=3 quorum
  # Anti-entropy off until the cluster has settled — flip on after
  # initial deploy, observe divergence reports for a day, then flip
  # auto-repair on.
  antiEntropyEnabled: "false"
  antiEntropyAutoRepair: "false"

  # ── Drain-on-scale-down (HPA safety) ─────────────────────────────────
  # Enabled in Clever Cloud overlay because we deploy with HPA on for
  # the agent fleet. Without this, scale-down would drop replicas below
  # the write quorum.
  retirement:
    enabled: true
    timeoutSeconds: 600

  # Memory-based HPA. Bucket cache + chunk cache + LSM blocks scale
  # with stored data, so memory % is a reasonable "filling up" signal.
  # min=max=3 right now: the dedicated nodegroup is 3× S, and one agent
  # fully occupies a node by request math. To grow past 3 agents,
  # either expand the nodegroup (`clever k8s nodegroups update
  # crossv9-dev agents S:N`) or enable nodegroup autoscaling on Clever
  # Cloud and bump maxReplicas to match.
  hpa:
    enabled: true
    minReplicas: 3            # matches replicationFactor and pool size
    maxReplicas: 3            # raise alongside nodegroup S:N
    targetMemoryUtilizationPercentage: 70
    scaleDownStabilizationWindowSeconds: 600  # 10 min — be patient
    scaleDownMaxPodsPerMinute: 1

  # ── Dedicated CKE nodegroup for agents ──────────────────────────────
  # The CKE cluster has an `agents` nodegroup (flavor S, 8 vCPU /
  # ~11.3 GiB allocatable per node) with a `role=agent:NoSchedule`
  # taint. Pinning the StatefulSet here gives RocksDB compaction the
  # full S-flavor CPU/IOPS budget per pod and stops the stateless tier
  # from co-locating onto the same nodes (the shared-XS layout was
  # starving compaction). Cross/gateway/control-center stay on the
  # untainted `default` nodegroup because they have no matching
  # toleration.
  #
  # The selector uses CKE's built-in nodegroup label, so no extra
  # `kubectl label` step is needed when scaling the nodegroup.
  nodeSelector:
    clever-cloud.com/nodegroup: agents
  tolerations:
    - key: role
      operator: Equal
      value: agent
      effect: NoSchedule

# ── Gateway ─────────────────────────────────────────────────────────
# Request-handling pods scale via HPA. The rebalance coordinator (and
# the in-memory RetirementTracker) is split into a separate
# single-replica gateway-coordinator deployment so multi-replica
# scaling can't race on drain handoffs. The chart enforces the
# split-when-HPA-on contract at render time.
gateway:
  replicaCount: 2            # initial; HPA takes over from here
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  pdb:
    enabled: true
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4            # stays within node budget alongside cross/agent
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationWindowSeconds: 300

# Singleton coordinator pod. Holds RetirementTracker state and runs
# the dispatch loop. Required when gateway.hpa.enabled=true.
gatewayCoordinator:
  enabled: true
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# ── Cross: scale-out via HPA + gRPC ingress ─────────────────────────
cross:
  replicaCount: 2            # initial; HPA takes over from here
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6            # stays within 4-node CKE budget
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationSeconds: 300
  ingress:
    enabled: true
    className: "nginx"
    # TODO(clevercloud): cross-grpc.<your-domain>
    host: ""
    annotations:
      # NGINX-Ingress annotations for gRPC stream-level round-robin.
      # backend-protocol=GRPC is the load-bearing one; the timeouts
      # let large file uploads through (cross's compress endpoint
      # can hold a stream open for minutes).
      nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      # TODO(clevercloud): if Clever Cloud's ingress controller wants
      # extra annotations (TLS cert reflection, regional pinning),
      # add them here.
    tls: []
  pdb:
    enabled: true

# ── Control center (operator UI) ────────────────────────────────────
controlcenter:
  enabled: true
  uiService:
    # ClusterIP rather than LoadBalancer here because the ingress
    # below shares the existing NGINX-Ingress IP. A second LB just
    # for the UI burns a public IP allocation; the ingress route is
    # equivalent in functionality and zero-cost.
    #
    # If you'd rather have a dedicated IP (e.g. for hostname-less
    # deployments), flip back to LoadBalancer and set ingress.enabled=false.
    type: ClusterIP
    annotations: {}
  persistence:
    storageClassName: ""    # TODO(clevercloud)
    size: "20Gi"
  # HTTP ingress — operator hits the UI without port-forwarding.
  # Uses the same NGINX-Ingress controller as cross-grpc, so the
  # cluster only needs one external LB IP for everything.
  #
  # Access pattern:
  #   1. Note the NGINX LB IP:
  #        kubectl -n ingress-nginx get svc ingress-nginx-controller
  #   2. Either point DNS at it, or add to /etc/hosts:
  #        <ip>  controlcenter.crossv9.local
  #   3. Open http://controlcenter.crossv9.local/ in your browser.
  ingress:
    enabled: true
    className: "nginx"
    host: "controlcenter.crossv9.local"   # change to a real hostname when DNS is wired up
    annotations:
      # The controlcenter UI loads incrementally and a few API
      # endpoints can hold the connection open while building the
      # fleet snapshot. Generous timeouts keep slow pulls from
      # being cut off by NGINX defaults (60s).
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      # Allow NDJSON.gz event-journal downloads to be streamed
      # without buffering — events.ndjson.gz can be hundreds of MB.
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
    tls: []
