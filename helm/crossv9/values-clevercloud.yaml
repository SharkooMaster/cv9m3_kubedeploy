# Clever Cloud Kubernetes Engine overlay.
#
# Apply on top of the default values.yaml, e.g.:
#   helm install cross . -f values.yaml -f values-clevercloud.yaml
#
# Most of these knobs are placeholders we fill in once we have the
# Clever Cloud cluster in front of us — `kubectl get sc`,
# `kubectl get ingressclass`, and the LB controller's annotation
# vocabulary (typically inherited from the upstream NGINX-Ingress).
#
# What's intentionally already set:
#   - Replicated agent fleet (StatefulSet, R=3).
#   - HPA + ingress on cross to spread external client load.
#   - PDBs everywhere so Clever's node maintenance can't drop
#     replicas faster than the rebalance coordinator can react.
#   - etcd kept single-pod (membership-only data; trade complexity
#     for the small risk of brief unavailability during etcd pod
#     reschedules).

global:
  fullnameOverride: "crossv9"

# Dedup chunk size. 1024 trades more chunks/RPCs/RocksDB entries per window
# for finer dedup granularity (better ratio on small-delta data). The v7
# classify prefetch + async store offset most of the extra per-chunk cost.
chunkSize: 1024

# Container images. cross + agent carry the new builds (non-blocking store,
# batched classify fetch). gateway/webinterface/controlcenter were not
# rebuilt, so they keep their current ghcr digests — REPLACE these if you
# have newer clevercloud builds for them.
imagePullSecrets:
  - name: ghcr-pull
images:
  agent:
    repository: "ghcr.io/sharkoomaster/crossv9-agent"
    tag: "sha256:3892e2c9dc6068172cb39b7e2f7188174b40a8f5f5a139c37506396768ce96eb"
    pullPolicy: Always
  cross:
    repository: "ghcr.io/sharkoomaster/crossv9-cross"
    tag: "sha256:74c066d78072818b8cd6cc27b05fd7ba4364c8ea06e2d92a5425c4452242884f"
    pullPolicy: Always
  gateway:
    repository: "ghcr.io/sharkoomaster/crossv9-gateway"
    tag: "sha256:71eb0c6f48fcb06a65b68bbd311b89b2bc5e9df586985e7ffa8ab0f5d51eb34c"
    pullPolicy: IfNotPresent
  webinterface:
    repository: "ghcr.io/sharkoomaster/crossv9-webinterface"
    tag: "latest"
    pullPolicy: IfNotPresent
  controlcenter:
    repository: "ghcr.io/sharkoomaster/crossv9-controlcenter"
    tag: "sha256:fb0f8ff1569f0091e64635727143131e16949faca3619b78232b87d954afd1d5"
    pullPolicy: Always

# Benchmark-only workload — not deployed on clevercloud. Declared so the
# chart renders without the benchmark values overlay (the template
# unconditionally reads .Values.benchrunner.enabled).
benchrunner:
  enabled: false

# Longhorn isn't shipped here — Clever Cloud provides its own CSI.
# Set storageClassName below to whatever `kubectl get sc` reports.
longhorn:
  enabled: false

# ── etcd (membership) ───────────────────────────────────────────────
etcd:
  enabled: true
  persistence:
    enabled: true
    storageClassName: ""    # TODO(clevercloud): set to the cluster's CSI class
    size: "1Gi"

# ── Postgres + Redis ────────────────────────────────────────────────
# Postgres is intentionally OFF on Clever Cloud: the agent storage
# backend is RocksDB, no service in the live deployment opens a
# postgres connection, and the bundled DB was just burning a 20Gi
# PVC + ~256Mi RAM for nothing. If a future workload needs SQL,
# point it at a managed Clever Cloud Postgres add-on via the
# externalPostgres block in values.yaml.
postgres:
  enabled: false

redis:
  persistence:
    enabled: true
    storageClassName: ""    # TODO(clevercloud)
    size: 20Gi

# ── Agent: replicated fleet on StatefulSet ──────────────────────────
agent:
  workloadKind: StatefulSet
  replicaCount: 2            # 1 agent per L node — see resources block below
  # R=2 with 2 agents = every chunk on both. Loss of one agent leaves
  # the survivor with a full copy; the restarting one restores from
  # /data/backup (Ceph) and catches up via the existing rebalance.
  replicationFactor: 2
  writeQuorum: 2
  vnodesPerAgent: 256
  # Non-blocking store: ack as soon as writes are queued instead of fsyncing
  # the RocksDB WAL on every BatchStore. Safe here because chunk+bucket data
  # is on local NVMe (localChunks) and every chunk is replicated to both
  # agents (R=2). The agent still drains synchronously when RocksDB reports
  # write pressure, so a stalled LSM is never piled on. This removes the
  # per-batch fsync latency from the store path (both replicas ack faster).
  storeAsync: "1"
  # RocksDB is the only backend that keeps bucket metadata and chunk
  # bytes in a single embedded store. The other backends require
  # Postgres on the chunk write path, which neither scales nor
  # bootstraps cleanly in this chart.
  storageBackend: rocksdb
  # Sized for the dedicated `agents` CKE nodegroup (L flavor:
  # 12 vCPU / ~22.4 GiB allocatable per node). 1 agent per node —
  # the request math (10 GiB) prevents the scheduler from packing
  # two agents onto the same L node, which is what makes the
  # StatefulSet spread naturally across the 2-node pool without a
  # podAntiAffinity rule. The limit gives the agent the rest of
  # the node for cache + compaction bursts.
  resources:
    requests:
      cpu: "2000m"
      memory: "10Gi"
    limits:
      cpu: "11000m"
      memory: "20Gi"
  # ── Caches sized to use the L node's RAM ──────────────────────────
  # Now that we're on L (~22 GiB allocatable) and chunks are local
  # (Ceph reads no longer in the hot path for foreground work), pour
  # most of the RAM into in-process caches. Fewer hot misses → lower
  # search latency. Numbers chosen to keep total resident below the
  # 20 GiB cgroup limit with comfortable headroom for the GC heap.
  #
  #   bucketCache (8 GiB, native): the bucket index for searches.
  #                                Hit rate dominates SearchBuckets latency.
  #   chunkCache  (4 GiB, native): byte-cache for dedup hits. Avoids
  #                                re-reading SST blocks on repeat lookups.
  #   GCHeapHardLimit (4 GiB):     managed heap cap.
  #   ──── total ───── ~16 GiB managed+caches, ~4 GiB free for RocksDB
  #                    block cache, glibc, page cache headroom.
  bucketCache:
    maxGb: "8"
    evictionIntervalSec: 10
    highWaterPct: "0.90"
    lowWaterPct: "0.75"
    hardCeilingPct: "0.98"
  chunkCache:
    sizeMb: 4096
    ttlMinutes: 60
  # ── GC tuning (must be set, defaults from values-k3-benchmark are 4 GiB) ──
  # The agent's cache-sizing path inspects GC.GetGCMemoryInfo()
  # .TotalAvailableMemoryBytes which echoes DOTNET_GCHeapHardLimit, NOT the
  # cgroup limit. With heapHardLimit at the k3 default (0x100000000 = 4 GiB)
  # the agent thinks it only has 4 GB and caps the 8 GiB bucket cache + 4 GiB
  # chunk cache configured above down to ~819 MB / ~204 MB respectively.
  # Raising the hard limit to 12 GiB gives the safety check enough headroom
  # to honour the configured cache sizes (bucketCache cap = 50% of heap =
  # 6 GiB, slightly under the configured 8 GiB but still 7× larger than the
  # k3 default).
  gc:
    conserveMemory: "5"
    heapHardLimit: "0x300000000" # 12 GiB managed heap, fits inside 20 GiB cgroup
    retainVm: "1"
    lohThreshold: "262144"
  persistence:
    enabled: true
    storageClassName: "csi-rbd-sc"   # CKE's only StorageClass (Ceph RBD)
    size: 60Gi
  # ── Hot/cold storage split (the search-latency fix) ──────────────────
  # CKE only exposes Ceph RBD as a StorageClass — every random 4 KiB read
  # is a TCP round-trip to a remote OSD. With ~50 000 cold seeks per
  # SearchBuckets RPC that's a 60-second floor regardless of how much CPU
  # we throw at the agent. localChunks moves /data/chunks to the worker
  # node's local NVMe (emptyDir) where seeks are sub-microsecond.
  #
  # Durability: relies on R=2 replication across peers — every chunk
  # lives on two agents. A single-pod restart wipes that pod's slice
  # (emptyDir is ephemeral) and the rebalance path rebuilds it from the
  # surviving peer. A correlated two-pod loss = data loss; acceptable
  # for a benchmarking cluster.
  #
  # The `cephBackup` block below was the previous "third copy" defense
  # but rsync-of-live-RocksDB cannot produce a consistent snapshot, so
  # it's been disabled. See the comment on agent.cephBackup for the
  # full failure mode and the path back to a safe implementation.
  localChunks:
    enabled: true
    sizeLimit: "30Gi"          # cap per pod's emptyDir; node has ~38 GiB ephemeral
  cephBackup:
    # ── DISABLED 2026-05-31 — rsync-of-live-RocksDB is unsafe ──────────
    # The sidecar's `rsync -a --delete-after` against a running RocksDB
    # cannot capture an internally-consistent snapshot: between when
    # rsync reads CURRENT/MANIFEST and when it walks the *.sst/*.ldb
    # files, RocksDB's compactor can rewrite the LSM and unlink the
    # files the manifest just referenced. Restoring such a snapshot
    # gives "Corruption: No such file or directory: ..../00NNNN.ldb in
    # file MANIFEST-NNNNNN" and the agent crash-loops. We hit this 3×.
    #
    # Durability for testing now relies entirely on R=2 replication
    # across peers (every chunk lives on two agents). On a single-pod
    # restart the pod's slice is rebuilt from the surviving peer via
    # the normal rebalance path; on a correlated 2-pod failure data is
    # lost — acceptable for a benchmarking cluster.
    #
    # Re-enabling this feature requires switching to RocksDB's native
    # Checkpoint or BackupEngine API (which take an LSM snapshot under
    # an internal lock so the on-disk view is consistent), then rsync-
    # ing the *checkpoint directory* to Ceph. Until then: keep this off.
    enabled: false
    intervalSec: 300
    storageClassName: "csi-rbd-sc"
    size: "60Gi"
    rsyncBwLimitKbps: ""
    image: "instrumentisto/rsync-ssh:alpine"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "1500m"
        memory: "512Mi"
  pdb:
    enabled: true
    # maxUnavailable: 1     # default protects R=3 quorum
  # Anti-entropy off until the cluster has settled — flip on after
  # initial deploy, observe divergence reports for a day, then flip
  # auto-repair on.
  antiEntropyEnabled: "false"
  antiEntropyAutoRepair: "false"

  # ── Drain-on-scale-down (HPA safety) ─────────────────────────────────
  # Enabled in Clever Cloud overlay because we deploy with HPA on for
  # the agent fleet. Without this, scale-down would drop replicas below
  # the write quorum.
  retirement:
    enabled: true
    timeoutSeconds: 600

  # Memory-based HPA. Bucket cache + chunk cache + LSM blocks scale
  # with stored data, so memory % is a reasonable "filling up" signal.
  # min=max=3 right now: the dedicated nodegroup is 3× S, and one agent
  # fully occupies a node by request math. To grow past 3 agents,
  # either expand the nodegroup (`clever k8s nodegroups update
  # crossv9-dev agents S:N`) or enable nodegroup autoscaling on Clever
  # Cloud and bump maxReplicas to match.
  hpa:
    enabled: true
    minReplicas: 2            # 1 per L node, fixed at the nodegroup size
    maxReplicas: 2            # raise alongside nodegroup L:N
    targetMemoryUtilizationPercentage: 80
    scaleDownStabilizationWindowSeconds: 600  # 10 min — be patient
    scaleDownMaxPodsPerMinute: 1

  # ── Dedicated CKE nodegroup for agents ──────────────────────────────
  # The CKE cluster has an `agents` nodegroup (flavor S, 8 vCPU /
  # ~11.3 GiB allocatable per node) with a `role=agent:NoSchedule`
  # taint. Pinning the StatefulSet here gives RocksDB compaction the
  # full S-flavor CPU/IOPS budget per pod and stops the stateless tier
  # from co-locating onto the same nodes (the shared-XS layout was
  # starving compaction). Cross/gateway/control-center stay on the
  # untainted `default` nodegroup because they have no matching
  # toleration.
  #
  # The selector uses CKE's built-in nodegroup label, so no extra
  # `kubectl label` step is needed when scaling the nodegroup.
  nodeSelector:
    clever-cloud.com/nodegroup: agents
  tolerations:
    - key: role
      operator: Equal
      value: agent
      effect: NoSchedule

# ── Gateway ─────────────────────────────────────────────────────────
# Request-handling pods scale via HPA. The rebalance coordinator (and
# the in-memory RetirementTracker) is split into a separate
# single-replica gateway-coordinator deployment so multi-replica
# scaling can't race on drain handoffs. The chart enforces the
# split-when-HPA-on contract at render time.
gateway:
  replicaCount: 2            # initial; HPA takes over from here
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  pdb:
    enabled: true
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4            # stays within node budget alongside cross/agent
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationWindowSeconds: 300

# Singleton coordinator pod. Holds RetirementTracker state and runs
# the dispatch loop. Required when gateway.hpa.enabled=true.
gatewayCoordinator:
  enabled: true
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# ── Cross: scale-out via HPA + gRPC ingress ─────────────────────────
cross:
  replicaCount: 2            # initial; HPA takes over from here
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6            # stays within 4-node CKE budget
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationSeconds: 300
  ingress:
    enabled: true
    className: "nginx"
    # TODO(clevercloud): cross-grpc.<your-domain>
    host: ""
    annotations:
      # NGINX-Ingress annotations for gRPC stream-level round-robin.
      # backend-protocol=GRPC is the load-bearing one; the timeouts
      # let large file uploads through (cross's compress endpoint
      # can hold a stream open for minutes).
      nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      # TODO(clevercloud): if Clever Cloud's ingress controller wants
      # extra annotations (TLS cert reflection, regional pinning),
      # add them here.
    tls: []
  pdb:
    enabled: true

# ── Control center (operator UI) ────────────────────────────────────
controlcenter:
  enabled: true
  uiService:
    # ClusterIP rather than LoadBalancer here because the ingress
    # below shares the existing NGINX-Ingress IP. A second LB just
    # for the UI burns a public IP allocation; the ingress route is
    # equivalent in functionality and zero-cost.
    #
    # If you'd rather have a dedicated IP (e.g. for hostname-less
    # deployments), flip back to LoadBalancer and set ingress.enabled=false.
    type: ClusterIP
    annotations: {}
  persistence:
    storageClassName: ""    # TODO(clevercloud)
    size: "20Gi"
  # HTTP ingress — operator hits the UI without port-forwarding.
  # Uses the same NGINX-Ingress controller as cross-grpc, so the
  # cluster only needs one external LB IP for everything.
  #
  # Access pattern:
  #   1. Note the NGINX LB IP:
  #        kubectl -n ingress-nginx get svc ingress-nginx-controller
  #   2. Either point DNS at it, or add to /etc/hosts:
  #        <ip>  controlcenter.crossv9.local
  #   3. Open http://controlcenter.crossv9.local/ in your browser.
  ingress:
    enabled: true
    className: "nginx"
    host: "controlcenter.crossv9.local"   # change to a real hostname when DNS is wired up
    annotations:
      # The controlcenter UI loads incrementally and a few API
      # endpoints can hold the connection open while building the
      # fleet snapshot. Generous timeouts keep slow pulls from
      # being cut off by NGINX defaults (60s).
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      # Allow NDJSON.gz event-journal downloads to be streamed
      # without buffering — events.ndjson.gz can be hundreds of MB.
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
    tls: []
