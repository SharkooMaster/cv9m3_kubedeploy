apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-cross
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
  {{- with .Values.cross.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.cross.service.type | default "ClusterIP" }}
  {{- if and (eq (.Values.cross.service.type | default "ClusterIP") "LoadBalancer") .Values.cross.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.cross.service.loadBalancerIP | quote }}
  {{- end }}
  {{- if and (eq (.Values.cross.service.type | default "ClusterIP") "LoadBalancer") .Values.cross.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.cross.service.externalTrafficPolicy | quote }}
  {{- end }}
  ports:
    - name: grpc
      port: {{ .Values.cross.service.grpcPort | default 5000 }}
      targetPort: grpc
    - name: http
      port: {{ .Values.cross.service.httpPort | default 5001 }}
      targetPort: http
  selector:
    app.kubernetes.io/component: cross
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-cross-headless
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Same reasoning as gateway-headless: keep DNS resolvable through the
  # readiness gate so peer services don't get NXDOMAIN during rolls.
  publishNotReadyAddresses: true
  ports:
    - name: grpc
      port: 5000
      targetPort: grpc
    - name: http
      port: 5001
      targetPort: http
  selector:
    app.kubernetes.io/component: cross
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crossv9.fullname" . }}-cross
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cross.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: cross
      {{- include "crossv9.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cross
        {{- include "crossv9.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: cross
          image: "{{ .Values.images.cross.repository }}{{ if hasPrefix "sha256:" .Values.images.cross.tag }}@{{ else }}:{{ end }}{{ .Values.images.cross.tag }}"
          imagePullPolicy: {{ .Values.images.cross.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 5000
            - name: http
              containerPort: 5001
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otel.endpoint | quote }}
            - name: DOTNET_PerfMapEnabled
              value: "1"
            - name: COMPlus_PerfMapEnabled
              value: "1"
            # Was 9 (most aggressive). Combined with the absent cgroup memory limit
            # this caused the .NET GC to thrash during 64 MB block processing for large
            # files — long pauses pushed the windowed pipeline below its real-time
            # target and contributed to client-side temp-file backlogs. With a proper
            # cgroup memory limit on cross now, we can let the GC run with a calmer
            # policy.
            - name: DOTNET_GCConserveMemory
              value: {{ default "5" .Values.cross.gc.conserveMemory | quote }}
            - name: DOTNET_GCHeapHardLimit
              value: {{ default "0x140000000" .Values.cross.gc.heapHardLimit | quote }}
            # Keep retired Gen2 segments around so the next compress pipeline
            # doesn't re-VirtualAlloc them. Pairs with the 1-minute Forced LOH
            # compaction timer in Program.cs to keep frag % stable.
            - name: DOTNET_GCRetainVM
              value: {{ default "1" .Values.cross.gc.retainVm | quote }}
            # Bump LOH threshold from 85 KB to 256 KB. The cross compress hot
            # path produces lots of arrays in the 85 KB–256 KB range (per-block
            # bitmasks, refs payloads, donor chunk batches). Pushing them off
            # the LOH onto Gen0/1 — where they compact for free — is the
            # cheapest single source of LOH-frag relief.
            - name: DOTNET_GCLOHThreshold
              value: {{ default "262144" .Values.cross.gc.lohThreshold | quote }}
            # Cap glibc malloc arenas. Cross is .NET-only on the hot path so
            # this matters less than on agent, but capping prevents the same
            # native-heap-bloat failure mode that we already cured on agent.
            - name: MALLOC_ARENA_MAX
              value: {{ default "2" .Values.cross.malloc.arenaMax | quote }}
            # Job-event telemetry: cross emits to the control-center pod over a
            # bounded channel. The hot path TryWrite drops events when the channel
            # is full so compression is never throttled by the dashboard.
            - name: JOB_EVENTS_ENABLED
              value: {{ default "true" (.Values.controlcenter.jobEventsEnabled | toString) | quote }}
            - name: JOB_EVENTS_ENDPOINT
              value: {{ printf "http://%s-controlcenter:5000" (include "crossv9.fullname" .) | quote }}
            - name: CROSS_MODE
              value: {{ .Values.mode.crossMode | quote }}
            - name: GATEWAY_LOADBALANCER
              value: {{ printf "%s-gateway-headless" (include "crossv9.fullname" .) | quote }}
            - name: AGENTS_LOADBALANCER
              value: {{ printf "%s-agent-headless" (include "crossv9.fullname" .) | quote }}
            # ── etcd: authoritative membership for RendezvousRouter ──
            # Cross subscribes to /agents/<podName> and atomically swaps its
            # member list on every event. This is what makes every cross pod
            # see the same agent ring at the same time (eliminating the
            # cross-pod routing drift that produced INTEGRITY_DECOMPRESS).
            # If unset, cross falls back to the legacy DNS+GetNodeInfo path
            # (which has the drift bug but still runs).
            {{- $etcdEndpoint := "" }}
            {{- if .Values.etcd.enabled }}
              {{- $etcdEndpoint = printf "http://%s-etcd.%s.svc.cluster.local:2379" (include "crossv9.fullname" .) .Release.Namespace }}
            {{- else if .Values.externalEtcd.endpoint }}
              {{- $etcdEndpoint = .Values.externalEtcd.endpoint }}
            {{- end }}
            {{- if $etcdEndpoint }}
            - name: ETCD_ENDPOINT
              value: {{ $etcdEndpoint | quote }}
            {{- end }}
            - name: CHUNK_SIZE
              value: {{ .Values.chunkSize | default 5120 | quote }}
            - name: CROSS_WINDOWED_THRESHOLD_MB
              value: {{ .Values.cross.windowedThresholdMB | default 256 | quote }}
            - name: CROSS_WINDOW_SIZE_MB
              value: {{ .Values.cross.windowSizeMB | default 64 | quote }}
            - name: CROSS_MAX_UPLOAD_BYTES
              value: {{ .Values.cross.maxUploadBytes | default "107374182400" | quote }}
            - name: CROSS_MAX_CONCURRENT
              value: {{ .Values.cross.maxConcurrent | default 4 | quote }}
            - name: CROSS_PIPELINE_PARALLELISM
              value: {{ .Values.cross.pipelineParallelism | default 4 | quote }}
            # ── Agent RPC throttle + circuit breaker tuning ──
            # AGENT_MAX_INFLIGHT_RPCS: max parallel cross→agent calls per agent
            #   pod (gate width). Default 4.
            # AGENT_RPC_MAX_ATTEMPTS: bounded retry across CircuitOpen /
            #   SlowAgent / network errors. Default 5.
            # AGENT_BREAKER_FAILURE_THRESHOLD: consecutive failures that trip
            #   the breaker. Default 5.
            # AGENT_BREAKER_COOLDOWN_SEC: how long Open stays Open before the
            #   next caller becomes the half-open probe. Default 30.
            # AGENT_RPC_SOFT_TIMEOUT_SEC: synthetic-failure soft deadline.
            #   The inner gRPC call is NOT cancelled; the caller just observes
            #   SlowAgentException at this point so a wedged agent eventually
            #   trips the breaker. Default 180 (~30–18 000× healthy latency).
            - name: AGENT_MAX_INFLIGHT_RPCS
              value: {{ default "4" .Values.cross.agentThrottle.maxInflight | quote }}
            - name: AGENT_RPC_MAX_ATTEMPTS
              value: {{ default "5" .Values.cross.agentThrottle.maxAttempts | quote }}
            - name: AGENT_BREAKER_FAILURE_THRESHOLD
              value: {{ default "5" .Values.cross.agentThrottle.breakerFailureThreshold | quote }}
            - name: AGENT_BREAKER_COOLDOWN_SEC
              value: {{ default "30" .Values.cross.agentThrottle.breakerCooldownSec | quote }}
            - name: AGENT_RPC_SOFT_TIMEOUT_SEC
              value: {{ default "180" .Values.cross.agentThrottle.softTimeoutSec | quote }}
            # ── Integrity smoketest ──
            # Compresses → immediately decompresses inside the SAME pod, byte-
            # diffs the result, and on mismatch logs the chunk index, encode
            # case, ref coords, encoder-base SHA, and the agent's fetched-base
            # SHA right now. Doubles every Compress's latency — keep off in
            # prod, flip on while hunting integrity bugs.
            {{- if .Values.cross.integrityDecompressSmoketest }}
            - name: INTEGRITY_DECOMPRESS_SMOKETEST
              value: {{ .Values.cross.integrityDecompressSmoketest | quote }}
            {{- end }}
            {{- if .Values.cross.searchTopK }}
            - name: SEARCH_TOP_K
              value: {{ .Values.cross.searchTopK | quote }}
            {{- end }}
            {{- if .Values.cross.mosaicDedup }}
            {{- if .Values.cross.mosaicDedup.enabled }}
            - name: ENABLE_MOSAIC_DEDUP
              value: {{ .Values.cross.mosaicDedup.enabled | quote }}
            {{- end }}
            {{- if .Values.cross.mosaicDedup.entropyThreshold }}
            - name: MOSAIC_ENTROPY_THRESHOLD
              value: {{ .Values.cross.mosaicDedup.entropyThreshold | quote }}
            {{- end }}
            {{- if .Values.cross.mosaicDedup.topK }}
            - name: MOSAIC_TOP_K
              value: {{ .Values.cross.mosaicDedup.topK | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.cross.laneSearch }}
            {{- if .Values.cross.laneSearch.enabled }}
            - name: ENABLE_LANE_SEARCH
              value: {{ .Values.cross.laneSearch.enabled | quote }}
            {{- end }}
            {{- if .Values.cross.laneSearch.hashBits }}
            - name: LANE_HASH_BITS
              value: {{ .Values.cross.laneSearch.hashBits | quote }}
            {{- end }}
            {{- if .Values.cross.laneSearch.searchMax }}
            - name: LANE_SEARCH_MAX
              value: {{ .Values.cross.laneSearch.searchMax | quote }}
            {{- end }}
            {{- end }}
            {{- if and .Values.cross.ccfStore (eq (.Values.cross.ccfStore.enabled | toString) "true") }}
            - name: ENABLE_CCF_STORE
              value: {{ .Values.cross.ccfStore.enabled | quote }}
            {{- if .Values.cross.ccfStore.backgroundServicesDisabled }}
            - name: CCF_BACKGROUND_SERVICES_DISABLED
              value: {{ .Values.cross.ccfStore.backgroundServicesDisabled | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.path }}
            - name: CCF_STORE_PATH
              value: {{ .Values.cross.ccfStore.path | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.packThreshold }}
            - name: CCF_PACK_THRESHOLD
              value: {{ .Values.cross.ccfStore.packThreshold | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.packIntervalSec }}
            - name: CCF_PACK_INTERVAL_SEC
              value: {{ .Values.cross.ccfStore.packIntervalSec | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.globalCompaction }}
            {{- if .Values.cross.ccfStore.globalCompaction.enabled }}
            - name: CCF_GLOBAL_COMPACTION_ENABLED
              value: {{ .Values.cross.ccfStore.globalCompaction.enabled | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.globalCompaction.maxSourcePacksPerCycle }}
            - name: CCF_COMPACTION_MAX_SOURCE_PACKS_PER_CYCLE
              value: {{ .Values.cross.ccfStore.globalCompaction.maxSourcePacksPerCycle | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.globalCompaction.maxReadBytesPerCycle }}
            - name: CCF_COMPACTION_MAX_READ_BYTES_PER_CYCLE
              value: {{ .Values.cross.ccfStore.globalCompaction.maxReadBytesPerCycle | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.globalCompaction.maxDurationSec }}
            - name: CCF_COMPACTION_MAX_DURATION_SEC
              value: {{ .Values.cross.ccfStore.globalCompaction.maxDurationSec | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.globalCompaction.maxWorkingSetMb }}
            - name: CCF_COMPACTION_MAX_WORKING_SET_MB
              value: {{ .Values.cross.ccfStore.globalCompaction.maxWorkingSetMb | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.globalCompaction.optimizerParallelism }}
            - name: CCF_OPTIMIZER_PARALLELISM
              value: {{ .Values.cross.ccfStore.globalCompaction.optimizerParallelism | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- if and .Values.cross.ccfStore (eq (.Values.cross.ccfStore.enabled | toString) "true") .Values.cross.ccfStore.persistence .Values.cross.ccfStore.persistence.enabled }}
          volumeMounts:
            - name: ccf-store
              mountPath: {{ .Values.cross.ccfStore.path | default "/data/ccf-store" }}
          {{- end }}
          {{- with .Values.cross.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if and .Values.cross.ccfStore (eq (.Values.cross.ccfStore.enabled | toString) "true") .Values.cross.ccfStore.persistence .Values.cross.ccfStore.persistence.enabled }}
      volumes:
        - name: ccf-store
          persistentVolumeClaim:
            claimName: {{ include "crossv9.fullname" . }}-ccf-store
      {{- end }}
{{- if and .Values.cross.ccfStore (eq (.Values.cross.ccfStore.enabled | toString) "true") .Values.cross.ccfStore.persistence .Values.cross.ccfStore.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "crossv9.fullname" . }}-ccf-store
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  {{- if .Values.cross.ccfStore.persistence.storageClassName }}
  storageClassName: {{ .Values.cross.ccfStore.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.cross.ccfStore.persistence.size | default "50Gi" }}
{{- end }}
