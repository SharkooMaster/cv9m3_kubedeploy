apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-cross
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
  {{- with .Values.cross.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.cross.service.type | default "ClusterIP" }}
  {{- if and (eq (.Values.cross.service.type | default "ClusterIP") "LoadBalancer") .Values.cross.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.cross.service.loadBalancerIP | quote }}
  {{- end }}
  {{- if and (eq (.Values.cross.service.type | default "ClusterIP") "LoadBalancer") .Values.cross.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.cross.service.externalTrafficPolicy | quote }}
  {{- end }}
  ports:
    - name: grpc
      port: {{ .Values.cross.service.grpcPort | default 5000 }}
      targetPort: grpc
    - name: http
      port: {{ .Values.cross.service.httpPort | default 5001 }}
      targetPort: http
  selector:
    app.kubernetes.io/component: cross
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-cross-headless
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: grpc
      port: 5000
      targetPort: grpc
    - name: http
      port: 5001
      targetPort: http
  selector:
    app.kubernetes.io/component: cross
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crossv9.fullname" . }}-cross
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cross.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: cross
      {{- include "crossv9.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cross
        {{- include "crossv9.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: cross
          image: "{{ .Values.images.cross.repository }}{{ if hasPrefix "sha256:" .Values.images.cross.tag }}@{{ else }}:{{ end }}{{ .Values.images.cross.tag }}"
          imagePullPolicy: {{ .Values.images.cross.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 5000
            - name: http
              containerPort: 5001
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otel.endpoint | quote }}
            - name: DOTNET_PerfMapEnabled
              value: "1"
            - name: COMPlus_PerfMapEnabled
              value: "1"
            - name: DOTNET_GCConserveMemory
              value: "9"
            - name: DOTNET_GCHeapHardLimit
              value: "0x140000000"
            - name: CROSS_MODE
              value: {{ .Values.mode.crossMode | quote }}
            - name: GATEWAY_LOADBALANCER
              value: {{ printf "%s-gateway-headless" (include "crossv9.fullname" .) | quote }}
            - name: AGENTS_LOADBALANCER
              value: {{ printf "%s-agent-headless" (include "crossv9.fullname" .) | quote }}
            - name: CHUNK_SIZE
              value: {{ .Values.chunkSize | default 5120 | quote }}
            - name: CROSS_WINDOWED_THRESHOLD_MB
              value: {{ .Values.cross.windowedThresholdMB | default 256 | quote }}
            - name: CROSS_WINDOW_SIZE_MB
              value: {{ .Values.cross.windowSizeMB | default 64 | quote }}
            - name: CROSS_MAX_UPLOAD_BYTES
              value: {{ .Values.cross.maxUploadBytes | default "107374182400" | quote }}
            - name: CROSS_MAX_CONCURRENT
              value: {{ .Values.cross.maxConcurrent | default 4 | quote }}
            - name: CROSS_PIPELINE_PARALLELISM
              value: {{ .Values.cross.pipelineParallelism | default 4 | quote }}
            {{- if .Values.cross.searchTopK }}
            - name: SEARCH_TOP_K
              value: {{ .Values.cross.searchTopK | quote }}
            {{- end }}
            {{- if .Values.cross.mosaicDedup }}
            {{- if .Values.cross.mosaicDedup.enabled }}
            - name: ENABLE_MOSAIC_DEDUP
              value: {{ .Values.cross.mosaicDedup.enabled | quote }}
            {{- end }}
            {{- if .Values.cross.mosaicDedup.entropyThreshold }}
            - name: MOSAIC_ENTROPY_THRESHOLD
              value: {{ .Values.cross.mosaicDedup.entropyThreshold | quote }}
            {{- end }}
            {{- if .Values.cross.mosaicDedup.topK }}
            - name: MOSAIC_TOP_K
              value: {{ .Values.cross.mosaicDedup.topK | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.cross.laneSearch }}
            {{- if .Values.cross.laneSearch.enabled }}
            - name: ENABLE_LANE_SEARCH
              value: {{ .Values.cross.laneSearch.enabled | quote }}
            {{- end }}
            {{- if .Values.cross.laneSearch.hashBits }}
            - name: LANE_HASH_BITS
              value: {{ .Values.cross.laneSearch.hashBits | quote }}
            {{- end }}
            {{- if .Values.cross.laneSearch.searchMax }}
            - name: LANE_SEARCH_MAX
              value: {{ .Values.cross.laneSearch.searchMax | quote }}
            {{- end }}
            {{- end }}
            {{- if and .Values.cross.ccfStore (eq (.Values.cross.ccfStore.enabled | toString) "true") }}
            - name: ENABLE_CCF_STORE
              value: {{ .Values.cross.ccfStore.enabled | quote }}
            {{- if .Values.cross.ccfStore.backgroundServicesDisabled }}
            - name: CCF_BACKGROUND_SERVICES_DISABLED
              value: {{ .Values.cross.ccfStore.backgroundServicesDisabled | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.path }}
            - name: CCF_STORE_PATH
              value: {{ .Values.cross.ccfStore.path | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.packThreshold }}
            - name: CCF_PACK_THRESHOLD
              value: {{ .Values.cross.ccfStore.packThreshold | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.packIntervalSec }}
            - name: CCF_PACK_INTERVAL_SEC
              value: {{ .Values.cross.ccfStore.packIntervalSec | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.globalCompaction }}
            {{- if .Values.cross.ccfStore.globalCompaction.enabled }}
            - name: CCF_GLOBAL_COMPACTION_ENABLED
              value: {{ .Values.cross.ccfStore.globalCompaction.enabled | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.globalCompaction.maxSourcePacksPerCycle }}
            - name: CCF_COMPACTION_MAX_SOURCE_PACKS_PER_CYCLE
              value: {{ .Values.cross.ccfStore.globalCompaction.maxSourcePacksPerCycle | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.globalCompaction.maxReadBytesPerCycle }}
            - name: CCF_COMPACTION_MAX_READ_BYTES_PER_CYCLE
              value: {{ .Values.cross.ccfStore.globalCompaction.maxReadBytesPerCycle | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.globalCompaction.maxDurationSec }}
            - name: CCF_COMPACTION_MAX_DURATION_SEC
              value: {{ .Values.cross.ccfStore.globalCompaction.maxDurationSec | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.globalCompaction.maxWorkingSetMb }}
            - name: CCF_COMPACTION_MAX_WORKING_SET_MB
              value: {{ .Values.cross.ccfStore.globalCompaction.maxWorkingSetMb | quote }}
            {{- end }}
            {{- if .Values.cross.ccfStore.globalCompaction.optimizerParallelism }}
            - name: CCF_OPTIMIZER_PARALLELISM
              value: {{ .Values.cross.ccfStore.globalCompaction.optimizerParallelism | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- if and .Values.cross.ccfStore (eq (.Values.cross.ccfStore.enabled | toString) "true") .Values.cross.ccfStore.persistence .Values.cross.ccfStore.persistence.enabled }}
          volumeMounts:
            - name: ccf-store
              mountPath: {{ .Values.cross.ccfStore.path | default "/data/ccf-store" }}
          {{- end }}
          {{- with .Values.cross.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if and .Values.cross.ccfStore (eq (.Values.cross.ccfStore.enabled | toString) "true") .Values.cross.ccfStore.persistence .Values.cross.ccfStore.persistence.enabled }}
      volumes:
        - name: ccf-store
          persistentVolumeClaim:
            claimName: {{ include "crossv9.fullname" . }}-ccf-store
      {{- end }}
{{- if and .Values.cross.ccfStore (eq (.Values.cross.ccfStore.enabled | toString) "true") .Values.cross.ccfStore.persistence .Values.cross.ccfStore.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "crossv9.fullname" . }}-ccf-store
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  {{- if .Values.cross.ccfStore.persistence.storageClassName }}
  storageClassName: {{ .Values.cross.ccfStore.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.cross.ccfStore.persistence.size | default "50Gi" }}
{{- end }}
