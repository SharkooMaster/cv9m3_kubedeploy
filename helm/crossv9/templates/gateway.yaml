apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-gateway
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 5000
      targetPort: grpc
    - name: http
      port: 5001
      targetPort: http
  selector:
    app.kubernetes.io/component: gateway
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-gateway-headless
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Publish pod IPs to DNS even before readinessProbe passes. Without this the
  # cross deployment hits "Name or service not known" for ~10–30 s every time
  # the gateway is still starting (or rolling), since headless services drop
  # NotReady endpoints from DNS by default. The gateway gRPC channel itself
  # has retry/keep-alive policies — letting it see the pod IP early lets it
  # back off cleanly instead of returning a hard SocketException to callers.
  publishNotReadyAddresses: true
  ports:
    - name: grpc
      port: 5000
      targetPort: grpc
    - name: http
      port: 5001
      targetPort: http
  selector:
    app.kubernetes.io/component: gateway
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crossv9.fullname" . }}-gateway
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
      {{- include "crossv9.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        {{- include "crossv9.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.images.gateway.repository }}{{ if hasPrefix "sha256:" .Values.images.gateway.tag }}@{{ else }}:{{ end }}{{ .Values.images.gateway.tag }}"
          imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 5000
            - name: http
              containerPort: 5001
          # Env is shared with the gateway-coordinator deployment via
          # the crossv9.gatewayEnv helper. The helper flips
          # REBALANCE_COORDINATOR_ENABLED based on whether the split
          # mode (gatewayCoordinator.enabled=true) is on; on the
          # request-path pods here it forces "false" in split mode so
          # only the singleton coordinator dispatches handoffs.
          env:
            {{- include "crossv9.gatewayEnv" (dict "root" . "coordinator" false) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- with .Values.gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}


