apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-gateway
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 5000
      targetPort: grpc
    - name: http
      port: 5001
      targetPort: http
  selector:
    app.kubernetes.io/component: gateway
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-gateway-headless
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Publish pod IPs to DNS even before readinessProbe passes. Without this the
  # cross deployment hits "Name or service not known" for ~10–30 s every time
  # the gateway is still starting (or rolling), since headless services drop
  # NotReady endpoints from DNS by default. The gateway gRPC channel itself
  # has retry/keep-alive policies — letting it see the pod IP early lets it
  # back off cleanly instead of returning a hard SocketException to callers.
  publishNotReadyAddresses: true
  ports:
    - name: grpc
      port: 5000
      targetPort: grpc
    - name: http
      port: 5001
      targetPort: http
  selector:
    app.kubernetes.io/component: gateway
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crossv9.fullname" . }}-gateway
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
      {{- include "crossv9.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        {{- include "crossv9.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.images.gateway.repository }}{{ if hasPrefix "sha256:" .Values.images.gateway.tag }}@{{ else }}:{{ end }}{{ .Values.images.gateway.tag }}"
          imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 5000
            - name: http
              containerPort: 5001
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otel.endpoint | quote }}
            - name: DOTNET_PerfMapEnabled
              value: "1"
            - name: COMPlus_PerfMapEnabled
              value: "1"
            - name: CROSS_MODE
              value: {{ .Values.mode.crossMode | quote }}
            - name: AGENTS_LOADBALANCER
              value: {{ printf "%s-agent-headless" (include "crossv9.fullname" .) | quote }}
            # ── etcd: gateway subscribes to the same /agents/ prefix as
            # cross so both build identical ConsistentHashRing snapshots.
            # If unset, gateway falls back to the legacy DNS+GetNodeInfo
            # path (which has the cross-pod drift bug).
            {{- $etcdEndpoint := "" }}
            {{- if .Values.etcd.enabled }}
              {{- $etcdEndpoint = printf "http://%s-etcd.%s.svc.cluster.local:2379" (include "crossv9.fullname" .) .Release.Namespace }}
            {{- else if .Values.externalEtcd.endpoint }}
              {{- $etcdEndpoint = .Values.externalEtcd.endpoint }}
            {{- end }}
            {{- if $etcdEndpoint }}
            - name: ETCD_ENDPOINT
              value: {{ $etcdEndpoint | quote }}
            {{- end }}
            # Replication factor + write quorum (gateway uses these for
            # log-line annotation; canonical fan-out lives on cross side).
            - name: REPLICATION_FACTOR
              value: {{ (default 3 .Values.agent.replicationFactor) | quote }}
            - name: WRITE_QUORUM
              value: {{ (default 2 .Values.agent.writeQuorum) | quote }}
            # Rebalance coordinator: exactly one gateway pod should set
            # this to true. The chart defaults to enabling it on every
            # gateway pod (the implementation is idempotent), but in a
            # multi-gateway deployment you can pin it to a specific pod
            # via a separate Deployment + selector.
            - name: REBALANCE_COORDINATOR_ENABLED
              value: {{ (default "true" .Values.gateway.rebalanceCoordinatorEnabled) | quote }}
            - name: CHUNK_SIZE
              value: {{ .Values.chunkSize | default 5120 | quote }}
            - name: GATEWAY_SEARCH_TIMEOUT_SEC
              value: {{ .Values.gateway.searchTimeoutSec | quote }}
            - name: GATEWAY_STORE_TIMEOUT_SEC
              value: {{ .Values.gateway.storeTimeoutSec | quote }}
            - name: GATEWAY_STREAM_CONCURRENCY
              value: {{ .Values.gateway.streamConcurrency | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- with .Values.gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}


