{{- /*
   Nil-guard. `helm upgrade --reuse-values` from a release that
   predates agent.hpa would otherwise crash with
   "nil pointer evaluating interface {}.enabled". `and` short-circuits
   on the missing parent dict so the HPA simply isn't rendered.
*/}}
{{- if and .Values.agent.hpa .Values.agent.hpa.enabled -}}
# Horizontal Pod Autoscaler for the agent StatefulSet.
#
# WHY MEMORY (not CPU):
#   Agents are I/O-bound on RocksDB writes. Their CPU stays at single-
#   digit-millicores even under heavy ingest because the compression
#   work is on the cross side. CPU-target HPA would never fire here.
#   Memory tracks the bucket cache + chunk cache + LSM index blocks,
#   which all grow with stored data — making it a usable proxy for
#   "this pod is approaching capacity, add another ordinal".
#
# WHY THIS REQUIRES retirement.enabled=true (CRITICAL):
#   StatefulSets scale-down by terminating the highest-ordinal pod.
#   Without the drain protocol the kubelet SIGTERMs that pod after a
#   30s grace period, ~256 vnodes have their primary disappear, and
#   anti-entropy has to repair the missing replicas after the fact.
#   A second scale-down within the anti-entropy window can drive R
#   below the write quorum → data loss on the next single failure.
#   With retirement.enabled=true the preStop hook blocks SIGTERM
#   until the gateway confirms the leaving pod's vnodes have been
#   copied to peers, restoring R=3 BEFORE termination completes.
#
#   The chart enforces this invariant at template-render time below;
#   `helm install` fails with a clear error if HPA is on but
#   retirement isn't.
#
# SCALE-DOWN BEHAVIOUR:
#   Conservative on purpose. With drain enabled, scale-down per pod
#   takes (terminationGracePeriodSeconds) ≈ minutes, so removing many
#   pods in quick succession would queue up an arbitrarily long tail
#   of terminations. We cap at 1 pod per scaleDownMaxPodsPerMinute
#   window and apply a ~5 min stabilization to avoid flapping.

{{- if and (and .Values.agent.hpa .Values.agent.hpa.enabled) (not (and .Values.agent.retirement .Values.agent.retirement.enabled)) }}
{{ fail "agent.hpa.enabled=true requires agent.retirement.enabled=true. Without the preStop drain hook, HPA scale-down can drop replication below the write quorum. Set agent.retirement.enabled=true to proceed." }}
{{- end }}

{{- /*
   Every reference below uses `default X (and dict dict.field)` so
   a partial values dict (e.g. `--reuse-values --set agent.hpa.enabled=true`
   with nothing else) doesn't render an HPA with empty
   averageUtilization / minReplicas / maxReplicas. The k8s API
   rejects those with errors like:
     "spec.metrics[0].resource.target.averageUtilization: Required value"
   The defaults here mirror values.yaml so the rendered HPA is
   always a valid resource even if the operator only flipped
   `enabled`.
*/}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "crossv9.fullname" . }}-agent
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "crossv9.fullname" . }}-agent
  minReplicas: {{ default 3 (and .Values.agent.hpa .Values.agent.hpa.minReplicas) }}
  maxReplicas: {{ default 10 (and .Values.agent.hpa .Values.agent.hpa.maxReplicas) }}
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ default 70 (and .Values.agent.hpa .Values.agent.hpa.targetMemoryUtilizationPercentage) }}
  behavior:
    scaleUp:
      # React to capacity-growth signals quickly — adding a pod is
      # safe (the rebalance coordinator handles incoming adoptions
      # without affecting writes/reads on the existing pods).
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: {{ default 300 (and .Values.agent.hpa .Values.agent.hpa.scaleDownStabilizationWindowSeconds) }}
      policies:
        # Cap removals to 1 pod per minute. Each removal triggers a
        # drain that takes up to terminationGracePeriodSeconds; queueing
        # multiple at once would only block the kubelet without
        # actually finishing faster.
        - type: Pods
          value: {{ default 1 (and .Values.agent.hpa .Values.agent.hpa.scaleDownMaxPodsPerMinute) }}
          periodSeconds: 60
{{- end }}
