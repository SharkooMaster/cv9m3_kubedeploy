apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-agent
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 5000
      targetPort: grpc
    - name: http
      port: 5001
      targetPort: http
  selector:
    app.kubernetes.io/component: agent
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-agent-headless
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Intentionally NOT publishNotReadyAddresses here. The agent's /ready gate
  # waits for BucketCacheManager warmup to finish; before that, even though
  # Kestrel is bound on :5000, the gRPC handlers are GC/IO-saturated by the
  # warmup work and routinely miss the gateway's 3 s GetNodeInfo deadline.
  # Surfacing those pod IPs early caused the gateway to "fall back to IP
  # routing" with a list of unready agents and serve cross requests against
  # them — the user-visible "gateway won't start" symptom. Keeping the
  # readiness gate ensures the headless service only points at agents that
  # can actually answer right now.
  ports:
    - name: grpc
      port: 5000
      targetPort: grpc
    - name: http
      port: 5001
      targetPort: http
  selector:
    app.kubernetes.io/component: agent
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: {{ .Values.agent.workloadKind | default "Deployment" }}
metadata:
  name: {{ include "crossv9.fullname" . }}-agent
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  {{- if eq (.Values.agent.workloadKind | default "Deployment") "Deployment" }}
  replicas: {{ .Values.agent.replicaCount }}
  {{- end }}
  {{- if eq (.Values.agent.workloadKind | default "Deployment") "StatefulSet" }}
  # serviceName MUST point at the headless service so each pod gets a
  # stable DNS A record (crossv9-agent-0.crossv9-agent-headless.<ns>.svc).
  # Rendezvous Hashing now keys off MY_POD_NAME, so this stable identity
  # is what makes routing survive node reschedules.
  serviceName: {{ include "crossv9.fullname" . }}-agent-headless
  replicas: {{ .Values.agent.replicaCount }}
  # Parallel pod management: bring all pods up simultaneously instead of
  # the default OrderedReady (which would serialise startup, blocking on
  # pod-0 fully ready before starting pod-1). Cross/gateway tolerate
  # partial fleets just fine via the headless DNS + GetNodeInfo refresh.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: agent
      {{- include "crossv9.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent
        {{- include "crossv9.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if and .Values.agent.retirement .Values.agent.retirement.enabled }}
      # Give the preStop drain hook headroom. Default 600s = 10 minutes,
      # which is long enough for a few-GB chunk store to fan out to all
      # surviving peers. Tune via agent.retirement.timeoutSeconds.
      # When retirement is disabled, k8s falls back to its 30s default.
      terminationGracePeriodSeconds: {{ default 600 .Values.agent.retirement.timeoutSeconds }}
      {{- end }}
      # ── Scheduling controls ──────────────────────────────────────────
      # Pin agents to a dedicated node pool when one is available
      # (CKE: a tainted `agents` nodegroup with role=agent label). With
      # the pool tainted, this StatefulSet is the only thing that can
      # land there, isolating RocksDB compaction CPU/IOPS from the
      # stateless tier. When the values are empty (default), agents
      # schedule wherever fits — exactly the legacy behaviour.
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
      ── Hot/cold storage split (agent.localChunks + agent.cephBackup) ────
      When localChunks.enabled=true the agent's /data/chunks lives on an
      emptyDir backed by the node's local SSD instead of network-attached
      Ceph RBD. RocksDB random reads on Ceph are O(ms) per 4 KiB block
      because every miss is a TCP round-trip to a remote OSD; on local
      NVMe they're O(µs). For the LSH search path, where a single batch
      fans out to ~50 000 random seeks across cold buckets, that's the
      difference between sub-second and 60-second responses.

      The trade-off is that emptyDir is wiped on any pod-level restart
      (crash, eviction, node drain). To make this safe in a system that
      already replicates with R=2 across peers, we add an *independent*
      durable copy on Ceph. cephBackup adds two pieces:

        • initContainer `restore-from-backup` runs before the agent
          starts; if /data/chunks is empty AND /data/backup has data,
          it rsyncs the backup back into /data/chunks. This is what
          makes an emptyDir-wiping restart non-fatal even when ALL
          peers happen to be down at the same time.

        • sidecar container `backup-sync` runs continuously alongside
          the agent. Every cephBackup.intervalSec it does an
          incremental `rsync -a --delete-after` from /data/chunks to
          /data/backup. Because rsync only transfers changed file
          contents and RocksDB SSTs are immutable once written, this
          becomes effectively a tail of newly-flushed SSTs each cycle.
          The agent never blocks on this — it keeps reading/writing
          /data/chunks at SSD speed while the sidecar drips data out
          to Ceph in the background.

      Loss budget: any data written in the last cephBackup.intervalSec
      that hasn't yet been rsync'd, AND that hasn't been replicated to
      a surviving peer, is lost on a wipe. With R=2 + 5 peers + 5-minute
      backup interval, this requires near-simultaneous failure of two
      peers + the Ceph cluster within a 5-minute window — an extremely
      rare correlated failure mode that anti-entropy further mitigates.

      When both flags are false the manifest reverts to the original
      single-PVC-per-pod shape (Ceph at /data/chunks), so this is a
      strict superset of the legacy behaviour.
      */}}
      {{- $localChunks := and .Values.agent.localChunks .Values.agent.localChunks.enabled }}
      {{- $cephBackup := and .Values.agent.cephBackup .Values.agent.cephBackup.enabled }}
      {{- if and $localChunks $cephBackup }}
      initContainers:
        - name: restore-from-backup
          image: {{ default "instrumentisto/rsync-ssh:alpine" .Values.agent.cephBackup.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Treat lost+found / .lock / .empty markers as "no real data".
              chunks_count=$(ls -1A /data/chunks 2>/dev/null | grep -vE '^(lost\+found|\.lock|\.empty)$' | wc -l)
              backup_count=$(ls -1A /data/backup 2>/dev/null | grep -vE '^(lost\+found|\.lock|\.empty)$' | wc -l)
              echo "[restore] chunks=$chunks_count backup=$backup_count"
              if [ "$chunks_count" -eq 0 ] && [ "$backup_count" -gt 0 ]; then
                echo "[restore] /data/chunks is empty AND /data/backup has data → restoring..."
                start=$(date +%s)
                # -a preserves perms/timestamps; --info=progress2 logs to stdout
                # so the kubelet log shows progress without spamming per-file
                # lines. /data/backup → /data/chunks (note trailing slashes).
                rsync -a --info=progress2 /data/backup/ /data/chunks/
                dur=$(( $(date +%s) - start ))
                size=$(du -sh /data/chunks 2>/dev/null | cut -f1 || echo "?")
                echo "[restore] complete in ${dur}s (size=${size})"
              else
                echo "[restore] no restore needed (chunks present or backup empty)"
              fi
          volumeMounts:
            - name: chunks
              mountPath: /data/chunks
            - name: chunks-backup
              mountPath: /data/backup
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.images.agent.repository }}{{ if hasPrefix "sha256:" .Values.images.agent.tag }}@{{ else }}:{{ end }}{{ .Values.images.agent.tag }}"
          imagePullPolicy: {{ .Values.images.agent.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 5000
            - name: http
              containerPort: 5001
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: DB_HOST
              value: {{ ternary (printf "%s-postgres" (include "crossv9.fullname" .)) (default "" .Values.externalPostgres.host) .Values.postgres.enabled | quote }}
            - name: DB_PORT
              value: {{ (ternary .Values.postgres.port (default 5432 .Values.externalPostgres.port) .Values.postgres.enabled) | quote }}
            - name: DB_USER
              value: {{ ternary .Values.postgres.user (default "" .Values.externalPostgres.user) .Values.postgres.enabled | quote }}
            - name: DB_PASSWORD
              value: {{ ternary .Values.postgres.password (default "" .Values.externalPostgres.password) .Values.postgres.enabled | quote }}
            - name: DB_DATABASE
              value: {{ ternary .Values.postgres.database (default "compressiondb" .Values.externalPostgres.database) .Values.postgres.enabled | quote }}
            - name: REDIS_HOST
              value: {{ ternary (printf "%s-redis" (include "crossv9.fullname" .)) (default "" .Values.externalRedis.host) .Values.redis.enabled | quote }}
            - name: REDIS_PORT
              value: {{ (ternary .Values.redis.port (default 6379 .Values.externalRedis.port) .Values.redis.enabled) | quote }}
            # ── etcd: agent registers itself under /agents/<podName> ──
            # so cross's RendezvousRouter can consume membership atomically
            # instead of relying on independent DNS+GetNodeInfo polling.
            # If etcd.enabled=false and no externalEtcd.endpoint is set we
            # omit the variable; the agent then runs without registration
            # (logs a one-liner) and cross falls back to legacy DNS routing.
            {{- $etcdEndpoint := "" }}
            {{- if .Values.etcd.enabled }}
              {{- $etcdEndpoint = printf "http://%s-etcd.%s.svc.cluster.local:2379" (include "crossv9.fullname" .) .Release.Namespace }}
            {{- else if .Values.externalEtcd.endpoint }}
              {{- $etcdEndpoint = .Values.externalEtcd.endpoint }}
            {{- end }}
            {{- if $etcdEndpoint }}
            - name: ETCD_ENDPOINT
              value: {{ $etcdEndpoint | quote }}
            {{- end }}
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otel.endpoint | quote }}
            - name: DOTNET_PerfMapEnabled
              value: "1"
            - name: COMPlus_PerfMapEnabled
              value: "1"
            # GCConserveMemory was 9 (most aggressive). At that level the GC reclaims
            # very aggressively at the cost of frequent stop-the-world pauses, which
            # were long enough to trip the liveness probe under heavy ingest. With the
            # bounded counter cache the managed heap is no longer pressure-prone, so we
            # let the GC run with a calmer policy (5 = balanced).
            - name: DOTNET_GCConserveMemory
              value: {{ default "5" .Values.agent.gc.conserveMemory | quote }}
            # Hard ceiling for the managed heap. Without this, .NET Server GC
            # pre-reserves heap based on the cgroup limit (14Gi), so the agent
            # starts at 9 GB RSS even with no data. A 4Gi cap forces the GC to
            # work harder when approaching the limit, leaving the rest of the
            # cgroup for RocksDB and glibc. Tuned in concert with the bounded
            # counter cache so managed-heap pressure stays low in normal ops.
            - name: DOTNET_GCHeapHardLimit
              value: {{ default "0x100000000" .Values.agent.gc.heapHardLimit | quote }}
            # Keep retired Gen2 segments around so the next allocation burst
            # doesn't have to re-VirtualAlloc them. Pairs with the 1-minute
            # Forced LOH compaction timer to keep frag % stable.
            - name: DOTNET_GCRetainVM
              value: {{ default "1" .Values.agent.gc.retainVm | quote }}
            # Bump the "is this an LOH allocation?" threshold from 85 KB to 256 KB.
            # Several hot-path arrays (similarity scratch, candidate vectors,
            # per-batch result buffers) land between those two values; raising
            # the threshold sends them to Gen0 instead, where they compact for free.
            - name: DOTNET_GCLOHThreshold
              value: {{ default "262144" .Values.agent.gc.lohThreshold | quote }}
            # Cap glibc malloc arenas. Without this glibc creates up to 8 × CPU
            # arenas (≈112 on 14-core nodes), each pre-reserving 64 MB of
            # uncompactable native heap → multi-GB RSS bloat with very little
            # live allocation. RocksDB allocates from these arenas, so a low
            # arena count concentrates native frag and keeps RSS predictable.
            - name: MALLOC_ARENA_MAX
              value: {{ default "2" .Values.agent.malloc.arenaMax | quote }}
            # Non-blocking store: when "1"/"true", Store/BatchStore ack as soon as writes
            # are queued (background 5s flush + cross R/W replication / replicated PVC such
            # as Ceph RBD provide durability). The agent still drains synchronously when
            # RocksDB reports write pressure. Default "0" keeps the synchronous-flush-before-ack
            # behavior, so durability is unchanged unless explicitly opted in.
            - name: AGENT_STORE_ASYNC
              value: {{ default "0" .Values.agent.storeAsync | quote }}
            # Also configure BoundedCounterCache via env vars so we can tune without rebuilds.
            - name: BUCKET_COUNTER_CACHE_CAPACITY
              value: {{ default "1000000" .Values.agent.counterCache.capacity | quote }}
            - name: BUCKET_COUNTER_CACHE_SHARDS
              value: {{ default "64" .Values.agent.counterCache.shards | quote }}
            - name: CHUNK_STORAGE_DIR
              value: "/data/chunks"
            - name: ROCKSDB_PATH
              value: {{ .Values.agent.rocksdb.path | quote }}
            - name: STORAGE_BACKEND
              value: {{ .Values.agent.storageBackend | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.agent.s3.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.agent.s3.bucket | quote }}
            - name: S3_ACCESS_KEY
              value: {{ .Values.agent.s3.accessKey | quote }}
            - name: S3_SECRET_KEY
              value: {{ .Values.agent.s3.secretKey | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ .Values.agent.s3.forcePathStyle | quote }}
            - name: S3_USE_SSL
              value: {{ .Values.agent.s3.useSsl | quote }}
            # Safe-against-missing-parent: if `--reuse-values` from
            # an old release leaves agent.bucketCache unset, every one
            # of these falls back to a sane built-in default rather
            # than crashing template render.
            - name: BUCKET_CACHE_MAX_GB
              value: {{ default "2.0" (and .Values.agent.bucketCache .Values.agent.bucketCache.maxGb) | quote }}
            - name: BUCKET_CACHE_EVICTION_SEC
              value: {{ default 10 (and .Values.agent.bucketCache .Values.agent.bucketCache.evictionIntervalSec) | quote }}
            - name: BUCKET_CACHE_HIGH_WATER_PCT
              value: {{ default "0.90" (and .Values.agent.bucketCache .Values.agent.bucketCache.highWaterPct) | quote }}
            - name: BUCKET_CACHE_LOW_WATER_PCT
              value: {{ default "0.75" (and .Values.agent.bucketCache .Values.agent.bucketCache.lowWaterPct) | quote }}
            - name: BUCKET_CACHE_HARD_CEILING_PCT
              value: {{ default "0.98" (and .Values.agent.bucketCache .Values.agent.bucketCache.hardCeilingPct) | quote }}
            - name: CHUNK_CACHE_SIZE_MB
              value: {{ .Values.agent.chunkCache.sizeMb | quote }}
            - name: CHUNK_CACHE_TTL_MINUTES
              value: {{ .Values.agent.chunkCache.ttlMinutes | quote }}
            - name: AGENT_REPLICATION_FACTOR
              value: {{ (default 3 .Values.agent.replicationFactor) | quote }}
            - name: VNODES_PER_AGENT
              value: {{ (default 256 .Values.agent.vnodesPerAgent) | quote }}
            # Anti-entropy is opt-in. Default disabled so a fresh deploy
            # observes baseline behaviour first; flip on per-environment
            # via values overlay once the rest of the cluster is healthy.
            - name: ANTI_ENTROPY_ENABLED
              value: {{ (default "false" .Values.agent.antiEntropyEnabled) | quote }}
            - name: ANTI_ENTROPY_AUTO_REPAIR
              value: {{ (default "false" .Values.agent.antiEntropyAutoRepair) | quote }}
            {{- if and .Values.dev .Values.dev.fastReset }}
            # Enables POST /admin/wipe. Tied to dev.fastReset because the
            # endpoint is harmless without an emptyDir volume to wipe.
            - name: ADMIN_DESTRUCTIVE_ENABLED
              value: "true"
            {{- end }}
            # Gateway URL used by the agent's POST /admin/retire endpoint
            # to poll for adoption completion during a drain. The agent
            # blocks the preStop hook until the gateway reports R copies
            # of the leaving pod's vnodes exist on surviving peers.
            #
            # When gatewayCoordinator.enabled=true the chart runs a
            # singleton coordinator deployment behind a dedicated
            # ClusterIP service, and we point the agent here so its
            # retirement-status polls always reach the pod with
            # authoritative tracker state. With a multi-replica request
            # gateway and per-pod tracker memory, that pod-pinning is
            # what makes drain correct under load.
            - name: GATEWAY_HTTP_URL
              {{- if and .Values.gatewayCoordinator .Values.gatewayCoordinator.enabled }}
              value: "http://{{ include "crossv9.fullname" . }}-gateway-coordinator.{{ .Release.Namespace }}.svc.cluster.local:5001"
              {{- else }}
              value: "http://{{ include "crossv9.fullname" . }}-gateway.{{ .Release.Namespace }}.svc.cluster.local:5001"
              {{- end }}
            - name: RETIREMENT_TIMEOUT_SECONDS
              value: {{ (default 600 (and .Values.agent.retirement .Values.agent.retirement.timeoutSeconds)) | quote }}
            - name: AGENT_HEADLESS_SVC
              value: "{{ include "crossv9.fullname" . }}-agent-headless.{{ .Release.Namespace }}.svc.cluster.local"
            - name: CHUNK_SIZE
              value: {{ .Values.chunkSize | default 5120 | quote }}
            {{- if .Values.agent.laneIndex }}
            {{- if .Values.agent.laneIndex.enabled }}
            - name: ENABLE_LANE_INDEX
              value: {{ .Values.agent.laneIndex.enabled | quote }}
            {{- end }}
            {{- if .Values.agent.laneIndex.hashBits }}
            - name: LANE_HASH_BITS
              value: {{ .Values.agent.laneIndex.hashBits | quote }}
            {{- end }}
            {{- if .Values.agent.laneIndex.searchMax }}
            - name: LANE_SEARCH_MAX
              value: {{ .Values.agent.laneIndex.searchMax | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
          # Liveness probe was: initialDelay=30s, period=10s, default failureThreshold=3
          # → restarted after only ~30s of HTTP unresponsiveness. Under the previous
          # heavy-load behaviour (RocksDB compaction + GC stalls) this was tripping
          # mid-ingest, forcing expensive cold restarts and amplifying the OOM cycle.
          # New tuning: longer initial delay (gives the bounded-cache constructor +
          # migration time on first start), longer period, higher failureThreshold so
          # we only restart after ~3 minutes of confirmed unresponsiveness.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ default 60 .Values.agent.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ default 30 .Values.agent.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ default 10 .Values.agent.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ default 6 .Values.agent.livenessProbe.failureThreshold }}
          {{- if and .Values.agent.retirement .Values.agent.retirement.enabled }}
          # ── Drain hook (HPA-safe scale-down) ────────────────────────
          # Invoked by the kubelet BEFORE SIGTERM. POST /admin/retire on
          # the agent flips its etcd status to "draining" and blocks
          # until the gateway's RebalanceCoordinator confirms every
          # vnode this pod owned has been copied to a surviving peer.
          # Only after the hook returns 0 does the kubelet proceed with
          # SIGTERM → terminationGracePeriodSeconds → SIGKILL.
          #
          # Without this hook a StatefulSet HPA scale-down would
          # SIGTERM the highest-ordinal pod after ~30s of grace; any
          # vnode whose primary was that pod would drop from R=3 to
          # R=2, and a near-simultaneous second scale-down (HPA can
          # do that) would push it to R=1. Single-failure data loss.
          #
          # Timeout: hook waits up to (terminationGracePeriodSeconds -
          # 30s) for the drain to complete. The agent's retire endpoint
          # itself observes RETIREMENT_TIMEOUT_SECONDS and returns 200
          # even on partial drain so the hook doesn't loop in k8s.
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    set -eu
                    TIMEOUT={{ default 600 .Values.agent.retirement.timeoutSeconds }}
                    HOOK_TIMEOUT=$((TIMEOUT - 30))
                    echo "[preStop] starting drain (timeout=${HOOK_TIMEOUT}s)"
                    # --max-time covers transport + body wait. We swallow non-zero
                    # so a network blip on the local loopback doesn't keep k8s
                    # blocking — surviving replicas + anti-entropy fill any gaps.
                    curl -fsS --max-time "${HOOK_TIMEOUT}" -X POST \
                      "http://127.0.0.1:5001/admin/retire?timeoutSec=${HOOK_TIMEOUT}" \
                      -d '' || echo "[preStop] retire call returned non-zero; proceeding anyway"
                    echo "[preStop] drain hook complete; ready for SIGTERM"
          {{- end }}
          volumeMounts:
            - name: chunks
              mountPath: /data/chunks
            {{- if and $localChunks $cephBackup }}
            # Mounted read-only on the agent: the agent only ever reads/writes
            # /data/chunks (local SSD); the backup volume is owned by the
            # backup-sync sidecar. Read-only here keeps a runaway agent from
            # accidentally bypassing the local-hot path and writing to Ceph
            # synchronously, which would re-introduce the latency we just
            # eliminated.
            - name: chunks-backup
              mountPath: /data/backup
              readOnly: true
            {{- end }}
          {{- with .Values.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if and $localChunks $cephBackup }}
        # ── backup-sync sidecar ─────────────────────────────────────────
        # Async durable-copy worker. Sleeps `intervalSec` between cycles,
        # then runs an incremental `rsync -a --delete-after` from local
        # /data/chunks → Ceph-backed /data/backup. Because RocksDB SSTs
        # are immutable once written and compactions delete old SSTs
        # atomically, each cycle effectively transfers only the newly
        # flushed SSTs and removes the now-obsolete ones — the steady-
        # state network volume is approximately the agent's compaction
        # write rate, not the full chunk store.
        #
        # We deliberately:
        #   • run the sync as a separate container so it can't block the
        #     agent's gRPC handlers even if Ceph is slow or stalled;
        #   • cap CPU/memory tightly because rsync's working set is
        #     small (file metadata) — most "work" is just I/O;
        #   • use --delete-after so the destination is only mutated AFTER
        #     a successful transfer, leaving /data/backup as a coherent
        #     restore point if the rsync is killed mid-cycle.
        #
        # We deliberately do NOT run rsync continuously (no --inotify,
        # no --partial spam) — RocksDB writes burst during compaction
        # and a dripped continuous sync would amplify Ceph load right
        # when the agent already needs that bandwidth for compaction
        # reads. A periodic batch is friendlier to the underlying
        # storage cluster.
        - name: backup-sync
          image: {{ default "instrumentisto/rsync-ssh:alpine" .Values.agent.cephBackup.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              INTERVAL={{ default 300 .Values.agent.cephBackup.intervalSec }}
              # Optional bandwidth cap (KB/s). Empty/0 = no cap.
              BWLIMIT={{ default "" .Values.agent.cephBackup.rsyncBwLimitKbps | quote }}
              RSYNC_OPTS="-a --delete-after --inplace --no-whole-file"
              if [ -n "${BWLIMIT}" ] && [ "${BWLIMIT}" != "0" ]; then
                RSYNC_OPTS="${RSYNC_OPTS} --bwlimit=${BWLIMIT}"
              fi
              mkdir -p /data/backup
              echo "[backup-sync] starting loop: interval=${INTERVAL}s opts='${RSYNC_OPTS}'"
              # Initial delay so we don't fight the init container's first-boot
              # restore on a fresh pod, and so the agent has time to become
              # ready before we add I/O pressure.
              sleep 60
              while true; do
                ts=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
                echo "[backup-sync] [${ts}] rsync /data/chunks/ → /data/backup/"
                start=$(date +%s)
                # Note: explicit trailing slashes copy CONTENTS not the dir.
                # 2>&1 captures rsync's stderr into the same stream so kubelet
                # logs surface partial-failure messages.
                if rsync ${RSYNC_OPTS} /data/chunks/ /data/backup/ 2>&1 | tail -3; then
                  dur=$(( $(date +%s) - start ))
                  size=$(du -sh /data/backup 2>/dev/null | cut -f1 || echo "?")
                  echo "[backup-sync] [${ts}] ok dur=${dur}s backup_size=${size}"
                else
                  rc=$?
                  echo "[backup-sync] [${ts}] rsync exited rc=${rc}; retrying next cycle"
                fi
                sleep "${INTERVAL}"
              done
          resources:
            requests:
              cpu: {{ default "50m" (and .Values.agent.cephBackup.resources .Values.agent.cephBackup.resources.requests .Values.agent.cephBackup.resources.requests.cpu) | quote }}
              memory: {{ default "64Mi" (and .Values.agent.cephBackup.resources .Values.agent.cephBackup.resources.requests .Values.agent.cephBackup.resources.requests.memory) | quote }}
            limits:
              cpu: {{ default "1000m" (and .Values.agent.cephBackup.resources .Values.agent.cephBackup.resources.limits .Values.agent.cephBackup.resources.limits.cpu) | quote }}
              memory: {{ default "256Mi" (and .Values.agent.cephBackup.resources .Values.agent.cephBackup.resources.limits .Values.agent.cephBackup.resources.limits.memory) | quote }}
          volumeMounts:
            - name: chunks
              mountPath: /data/chunks
              readOnly: true
            - name: chunks-backup
              mountPath: /data/backup
        {{- end }}
      {{- if or (ne (.Values.agent.workloadKind | default "Deployment") "StatefulSet") (and .Values.dev .Values.dev.fastReset) (and $localChunks (not $cephBackup)) (and $localChunks $cephBackup) }}
      # Deployment / DaemonSet branch + dev.fastReset escape hatch + new
      # local-chunks branch. Three flags can promote the `chunks` volume
      # from a per-pod PVC to an emptyDir (with progressively stronger
      # caveats):
      #
      #   • dev.fastReset=true        — inner-loop dev. Pod restart wipes
      #                                 data; no PVC provisioning delay.
      #                                 Not for production.
      #   • localChunks (no backup)   — local SSD only. Pod restart wipes
      #                                 the agent's slice; replication
      #                                 must rebuild it from peers (R≥2
      #                                 required). Use for benchmarks
      #                                 where speed >> recovery time.
      #   • localChunks + cephBackup  — local SSD with async durable copy
      #                                 to Ceph. Pod restart triggers an
      #                                 init-container restore from the
      #                                 backup PVC, so a wipe is recovered
      #                                 within seconds even with all
      #                                 peers down. This is the recommended
      #                                 production shape for a network-
      #                                 attached-storage cluster.
      volumes:
        - name: chunks
          {{- if or (and .Values.dev .Values.dev.fastReset) $localChunks }}
          # emptyDir with optional sizeLimit. With no medium specified the
          # kubelet places it on the node's ephemeral filesystem, which on
          # CKE is the local NVMe-backed volume the worker boots from.
          emptyDir:
            {{- if and $localChunks .Values.agent.localChunks.sizeLimit }}
            sizeLimit: {{ .Values.agent.localChunks.sizeLimit | quote }}
            {{- end }}
          {{- else if and .Values.agent.persistence.enabled (eq (.Values.agent.workloadKind | default "Deployment") "DaemonSet") }}
          hostPath:
            path: {{ .Values.agent.persistence.hostPath | default "/var/lib/crossv9/chunks" }}
            type: DirectoryOrCreate
          {{- else if .Values.agent.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "crossv9.fullname" . }}-agent-chunks
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
  {{- /*
    Decide whether we're emitting any volumeClaimTemplates this render:
      • `chunks`         — when localChunks=false (legacy: PVC at /data/chunks)
      • `chunks-backup`  — when cephBackup=true   (Ceph PVC at /data/backup)
    With both flags off OR localChunks=true && cephBackup=false (pure
    local mode, no durable backing) we omit the parent key entirely —
    a StatefulSet rejects `volumeClaimTemplates: []` and we don't want
    to ship an empty list to the API.
  */}}
  {{- $emitChunksPvc := and (not $localChunks) (not (and .Values.dev .Values.dev.fastReset)) }}
  {{- $emitBackupPvc := $cephBackup }}
  {{- if and (eq (.Values.agent.workloadKind | default "Deployment") "StatefulSet") (or $emitChunksPvc $emitBackupPvc) }}
  # ── volumeClaimTemplates ───────────────────────────────────────────
  # Emitted only when at least one PVC is needed (see flag math above).
  {{- if and $cephBackup (not (and .Values.agent.persistence.enabled .Values.agent.persistence.storageClassName)) }}
  {{- fail "agent.cephBackup.enabled=true requires agent.persistence.enabled=true with a storageClassName (the backup volume reuses that StorageClass by default)." }}
  {{- end }}
  volumeClaimTemplates:
    {{- if $emitChunksPvc }}
    # Legacy shape: persistent volume mounted directly at /data/chunks.
    # Binds to its owning pod across reschedules (Rendezvous Hashing
    # relies on stable pod→storage identity).
    - metadata:
        name: chunks
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.agent.persistence.storageClassName }}
        storageClassName: {{ .Values.agent.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.agent.persistence.size | quote }}
    {{- end }}
    {{- if $emitBackupPvc }}
    # Per-pod backup volume for the local-chunks + cephBackup mode.
    # Mounted at /data/backup; written by the `backup-sync` sidecar,
    # read by the `restore-from-backup` initContainer on cold start.
    # Defaults inherit from agent.persistence so the same StorageClass
    # / size used to back the legacy chunks PVC is reused unless
    # overridden explicitly under agent.cephBackup.
    - metadata:
        name: chunks-backup
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ default .Values.agent.persistence.storageClassName .Values.agent.cephBackup.storageClassName | quote }}
        resources:
          requests:
            storage: {{ default .Values.agent.persistence.size .Values.agent.cephBackup.size | quote }}
    {{- end }}
  {{- end }}
{{- if and .Values.agent.persistence.enabled (eq (.Values.agent.workloadKind | default "Deployment") "Deployment") }}
---
# Standalone PVC for Deployment mode (single PVC shared by all replicas — only safe with RWX).
# Not used by StatefulSet (which has its own per-pod PVCs via volumeClaimTemplates).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "crossv9.fullname" . }}-agent-chunks
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.agent.persistence.storageClassName }}
  storageClassName: {{ .Values.agent.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.agent.persistence.size | quote }}
{{- end }}


