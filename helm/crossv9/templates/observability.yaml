{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crossv9.fullname" . }}-prometheus-config
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: "crossv9-cross"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "crossv9.fullname" . }}-cross:5001"]
      - job_name: "crossv9-gateway"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "crossv9.fullname" . }}-gateway:5001"]
      - job_name: "crossv9-agent"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "crossv9.fullname" . }}-agent:5001"]
      - job_name: "crossv9-webinterface"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "crossv9.fullname" . }}-webinterface:5000"]
      - job_name: "otel-collector"
        static_configs:
          - targets: ["{{ include "crossv9.fullname" . }}-otel-collector:8889"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crossv9.fullname" . }}-prometheus
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: observability-prometheus
      {{- include "crossv9.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: observability-prometheus
        {{- include "crossv9.labels" . | nindent 8 }}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image | quote }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.observability.prometheus.retention }}"
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: {{ include "crossv9.fullname" . }}-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-prometheus
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  type: {{ .Values.observability.prometheus.service.type }}
  ports:
    - name: http
      port: {{ .Values.observability.prometheus.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/component: observability-prometheus
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crossv9.fullname" . }}-tempo-config
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        compaction_window: 1h
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crossv9.fullname" . }}-tempo
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability-tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: observability-tempo
      {{- include "crossv9.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: observability-tempo
        {{- include "crossv9.labels" . | nindent 8 }}
    spec:
      containers:
        - name: tempo
          image: {{ .Values.observability.tempo.image | quote }}
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - name: http
              containerPort: 3200
            - name: otlp
              containerPort: 4317
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
      volumes:
        - name: config
          configMap:
            name: {{ include "crossv9.fullname" . }}-tempo-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-tempo
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp
      port: 4317
      targetPort: otlp
  selector:
    app.kubernetes.io/component: observability-tempo
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crossv9.fullname" . }}-otel-collector-config
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch: {}
    exporters:
      otlp/tempo:
        endpoint: {{ include "crossv9.fullname" . }}-tempo:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crossv9.fullname" . }}-otel-collector
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability-otel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: observability-otel
      {{- include "crossv9.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: observability-otel
        {{- include "crossv9.labels" . | nindent 8 }}
    spec:
      containers:
        - name: otel-collector
          image: "otel/opentelemetry-collector-contrib:0.108.0"
          args: ["--config=/etc/otel/collector.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: prom-metrics
              containerPort: 8889
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: {{ include "crossv9.fullname" . }}-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-otel-collector
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: prom-metrics
      port: 8889
      targetPort: prom-metrics
  selector:
    app.kubernetes.io/component: observability-otel
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crossv9.fullname" . }}-pyroscope
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability-pyroscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: observability-pyroscope
      {{- include "crossv9.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: observability-pyroscope
        {{- include "crossv9.labels" . | nindent 8 }}
    spec:
      containers:
        - name: pyroscope
          image: {{ .Values.observability.pyroscope.image | quote }}
          args:
            - "server"
          ports:
            - name: http
              containerPort: 4040
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-pyroscope
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  type: {{ .Values.observability.pyroscope.service.type }}
  ports:
    - name: http
      port: {{ .Values.observability.pyroscope.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/component: observability-pyroscope
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crossv9.fullname" . }}-alloy-config
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
data:
  config.alloy: |
    pyroscope.write "default" {
      endpoint {
        url = "http://{{ include "crossv9.fullname" . }}-pyroscope:4040"
      }
    }
    pyroscope.ebpf "pods" {
      forward_to = [pyroscope.write.default.receiver]
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "crossv9.fullname" . }}-alloy
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability-alloy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: observability-alloy
      {{- include "crossv9.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: observability-alloy
        {{- include "crossv9.labels" . | nindent 8 }}
    spec:
      hostPID: true
      containers:
        - name: alloy
          image: {{ .Values.observability.alloy.image | quote }}
          args:
            - "run"
            - "/etc/alloy/config.alloy"
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: proc
              mountPath: /host/proc
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "crossv9.fullname" . }}-alloy-config
        - name: proc
          hostPath:
            path: /proc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crossv9.fullname" . }}-grafana-datasources
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "crossv9.fullname" . }}-prometheus:9090
        isDefault: true
      - name: Tempo
        type: tempo
        access: proxy
        url: http://{{ include "crossv9.fullname" . }}-tempo:3200
      - name: Pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://{{ include "crossv9.fullname" . }}-pyroscope:4040
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crossv9.fullname" . }}-grafana
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: observability-grafana
      {{- include "crossv9.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: observability-grafana
        {{- include "crossv9.labels" . | nindent 8 }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image | quote }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.observability.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.observability.grafana.adminPassword | quote }}
            - name: GF_INSTALL_PLUGINS
              value: "grafana-pyroscope-app"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasources
          configMap:
            name: {{ include "crossv9.fullname" . }}-grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-grafana
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  type: {{ .Values.observability.grafana.service.type }}
  ports:
    - name: http
      port: {{ .Values.observability.grafana.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/component: observability-grafana
    {{- include "crossv9.labels" . | nindent 4 }}
{{- end }}