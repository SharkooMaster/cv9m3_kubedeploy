apiVersion: v1
kind: Service
metadata:
  name: {{ include "crossv9.fullname" . }}-webinterface
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webinterface.service.type }}
  ports:
    - name: http
      port: {{ .Values.webinterface.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/component: webinterface
    {{- include "crossv9.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crossv9.fullname" . }}-webinterface
  labels:
    {{- include "crossv9.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.webinterface.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: webinterface
      {{- include "crossv9.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: webinterface
        {{- include "crossv9.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: webinterface
          image: "{{ .Values.images.webinterface.repository }}{{ if hasPrefix "sha256:" .Values.images.webinterface.tag }}@{{ else }}:{{ end }}{{ .Values.images.webinterface.tag }}"
          imagePullPolicy: {{ .Values.images.webinterface.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: CrossService__Url
              value: {{ printf "http://%s-cross-headless:5000" (include "crossv9.fullname" .) | quote }}
            - name: Database__Host
              value: {{ ternary (printf "%s-postgres" (include "crossv9.fullname" .)) (default "" .Values.externalPostgres.host) .Values.postgres.enabled | quote }}
            - name: Database__Port
              value: {{ (ternary .Values.postgres.port (default 5432 .Values.externalPostgres.port) .Values.postgres.enabled) | quote }}
            - name: Database__User
              value: {{ ternary .Values.postgres.user (default "" .Values.externalPostgres.user) .Values.postgres.enabled | quote }}
            - name: Database__Password
              value: {{ ternary .Values.postgres.password (default "" .Values.externalPostgres.password) .Values.postgres.enabled | quote }}
            - name: Database__Database
              value: {{ ternary .Values.postgres.database (default "compressiondb" .Values.externalPostgres.database) .Values.postgres.enabled | quote }}
            - name: ChunkStorage__Directory
              value: "/data/chunks"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: chunks
              mountPath: /data/chunks
          {{- with .Values.webinterface.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: chunks
          emptyDir: {}


